<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 币安合约交易系统</title>
<style>
:root {
  --bg:     #f0f2f5;
  --panel:  #ffffff;
  --border: #dde1ea;
  --text:   #1a1d2b;
  --muted:  #8892a4;
  --blue:   #2563eb;
  --blue2:  #1d4ed8;
  --green:  #16a34a;
  --red:    #dc2626;
  --font-mono: 'Consolas','SF Mono','Courier New',monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-mono);
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex;
  align-items: center; justify-content: center;
}

.wrap { width: 100%; max-width: 400px; padding: 16px; }

.box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 40px 36px;
  box-shadow: 0 4px 24px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
}

.logo { text-align: center; margin-bottom: 32px; }
.logo-icon {
  width: 54px; height: 54px; margin: 0 auto 14px;
  background: rgba(37,99,235,.1);
  border: 1px solid rgba(37,99,235,.25);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.logo h1 {
  font-size: 15px; font-weight: 700; color: var(--text);
  letter-spacing: 2px; margin-bottom: 5px;
}
.logo p { font-size: 10px; color: var(--muted); letter-spacing: 2px; }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 7px; letter-spacing: 1px; font-weight: 600; }
.inp {
  width: 100%;
  background: #f7f8fa; border: 1px solid var(--border);
  border-radius: 6px; padding: 11px 14px; color: var(--text);
  font-size: 13px; outline: none; transition: all .2s; font-family: var(--font-mono);
}
.inp:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.inp::placeholder { color: var(--muted); }

.captcha-row { display: flex; gap: 10px; align-items: flex-end; }
.captcha-row .inp { flex: 1; }
.captcha-img {
  width: 110px; height: 40px; border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; overflow: hidden;
  background: #f7f8fa; transition: border-color .2s;
}
.captcha-img:hover { border-color: var(--blue); }
.captcha-img img { width: 100%; height: 100%; display: block; }

.btn {
  width: 100%;
  background: var(--blue); color: #fff;
  border: none; border-radius: 6px;
  padding: 12px; font-size: 13px; font-weight: 700; cursor: pointer;
  transition: background .2s, transform .1s; margin-top: 8px;
  font-family: var(--font-mono); letter-spacing: 2px;
}
.btn:hover { background: var(--blue2); }
.btn:active { transform: scale(.99); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.alert {
  padding: 10px 14px; border-radius: 6px; font-size: 11px;
  margin-bottom: 18px; display: none; letter-spacing: .5px;
}
.alert.error   { background: rgba(220,38,38,.06); border: 1px solid rgba(220,38,38,.2); color: var(--red); }
.alert.success { background: rgba(22,163,74,.06); border: 1px solid rgba(22,163,74,.2); color: var(--green); }

.footer {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 22px; font-size: 10px; color: var(--muted); letter-spacing: 1px;
}
.dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div class="logo">
      <div class="logo-icon">&#9889;</div>
      <h1>币安合约交易系统</h1>
      <p>安全验证 &mdash; v4.0</p>
    </div>

    <div class="alert" id="alert"></div>

    <form id="login-form" onsubmit="login(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" class="inp" id="username" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="inp" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>验证码</label>
        <div class="captcha-row">
          <input type="text" class="inp" id="captcha" placeholder="输入验证码" required autocomplete="off" maxlength="4">
          <div class="captcha-img" onclick="refreshCaptcha()" title="点击刷新">
            <img id="captcha-image" src="/api/auth/captcha" alt="验证码">
          </div>
        </div>
      </div>
      <button type="submit" class="btn" id="btn-login">登 录</button>
    </form>

    <div class="footer">
      <div class="dot"></div>
      安全加密连接
    </div>
  </div>
</div>

<script>
function refreshCaptcha() {
  document.getElementById('captcha-image').src = '/api/auth/captcha?' + Date.now();
  document.getElementById('captcha').value = '';
  document.getElementById('captcha').focus();
}
function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg; el.className = 'alert ' + (type||'error'); el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}
async function login(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const captcha  = document.getElementById('captcha').value.trim();
  if (!username || !password || !captcha) { showAlert('请填写所有字段'); return; }
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = '验证中...';
  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, captcha })
    });
    const data = await res.json();
    if (data.ok) {
      showAlert('登录成功，正在跳转...', 'success');
      setTimeout(() => window.location.href = '/', 800);
    } else {
      showAlert(data.msg || '登录失败，请重试');
      refreshCaptcha(); btn.disabled = false; btn.textContent = '登 录';
    }
  } catch(err) {
    showAlert('网络错误: ' + err.message);
    refreshCaptcha(); btn.disabled = false; btn.textContent = '登 录';
  }
}
document.getElementById('captcha').addEventListener('keypress', e => { if (e.key==='Enter') login(e); });
window.addEventListener('load', () => document.getElementById('username').focus());
</script>
</body>
</html>
