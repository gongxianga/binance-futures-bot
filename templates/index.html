<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binance Futures Bot v4.0</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root {
  --bg:#f0f4f8; --bg2:#ffffff; --bg3:#f5f7fa; --bg4:#eef1f6;
  --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
  --accent:#6366f1; --accent2:#818cf8;
  --green:#10b981; --red:#ef4444; --yellow:#f59e0b;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --shadow-md:0 4px 24px rgba(99,102,241,.12);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --bg4:#1c2128;
  --text:#e6edf3; --muted:#7d8590; --border:#30363d;
  --accent:#7c6aff; --accent2:#a78bfa;
  --green:#3fb950; --red:#f85149; --yellow:#d29922;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  --shadow-md:0 4px 24px rgba(124,106,255,.15);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;height:52px;flex-shrink:0;box-shadow:var(--shadow)}
.hdr-logo{font-size:14px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;letter-spacing:.5px}
.hdr-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.inp{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:5px 10px;color:var(--text);font-size:12px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.conn-dot{font-size:11px;white-space:nowrap;padding:3px 8px;border-radius:12px;background:var(--bg3)}
.conn-dot.ok{color:var(--green);background:rgba(16,185,129,.1)}
.conn-dot.err{color:var(--red);background:rgba(239,68,68,.08)}
.user-badge{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}

/* ── Buttons ── */
.btn{border:none;border-radius:7px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)} .btn:active{filter:brightness(.95)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.3)}
.btn-long{background:linear-gradient(135deg,#059669,var(--green));color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.25)}
.btn-short{background:linear-gradient(135deg,#dc2626,var(--red));color:#fff;box-shadow:0 2px 8px rgba(239,68,68,.25)}
.btn-ghost{background:var(--bg3);border:1px solid var(--border);color:var(--text)}
.btn-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--yellow)}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red)}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:6px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}

/* ── Body Layout ── */
.body{display:flex;flex-direction:row;padding:8px;gap:0;flex:1;overflow:hidden;min-height:0}
.panel-left{width:420px;min-width:200px;display:flex;flex-direction:column;flex-shrink:0;gap:0}
.panel-mid{flex:1;min-width:280px;display:flex;flex-direction:column;overflow:hidden;gap:0}
.panel-right{width:260px;min-width:160px;flex-shrink:0;display:flex;flex-direction:column}
.resizer-col{width:8px;cursor:col-resize;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s}
.resizer-col::after{content:'';width:3px;height:36px;background:var(--border);border-radius:2px;transition:all .2s}
.resizer-col:hover::after,.resizer-col.dragging::after{background:var(--accent);height:60px}
.resizer-row{height:8px;cursor:row-resize;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.resizer-row::after{content:'';height:3px;width:36px;background:var(--border);border-radius:2px;transition:all .2s}
.resizer-row:hover::after,.resizer-row.dragging::after{background:var(--accent);width:60px}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card-hdr{padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px}
.card-hdr .title{color:var(--text);font-size:12px;text-transform:none;letter-spacing:0}

/* ── Left Panel ── */
.left-card{flex:1;display:flex;flex-direction:column;min-height:0}
.left-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px;background:var(--bg2);flex-shrink:0}
.ltab{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.ltab.active{color:var(--accent);border-bottom-color:var(--accent)}
.ltab:hover:not(.active){color:var(--text)}
.left-panel-body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
#radar-chart{flex:1;min-height:0}
.scan-panel{flex:1;overflow-y:auto;padding:12px}

/* ── Scan ── */
.scan-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.scan-field label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.form-inp{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-size:12px;outline:none;width:100%;transition:border-color .15s}
.form-inp:focus{border-color:var(--accent)}
select.form-inp{cursor:pointer}
.mode-row{display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
.mode-row label{display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--text)}
.scan-ctrl{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.scan-badge{font-size:11px;color:var(--muted);padding:3px 8px;background:var(--bg3);border-radius:10px;white-space:nowrap}
.prog-wrap{margin-bottom:8px;display:none}
.prog-info{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px}
.prog-bar{background:var(--bg3);border-radius:4px;height:5px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .3s}
.scan-sep{border:none;border-top:1px solid var(--border);margin:10px 0}

/* ── Right panel (trade) ── */
.right-card{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 10px;flex-shrink:0}
.tab{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-body{flex:1;overflow-y:auto;padding:14px}
.tab-panel{display:none}.tab-panel.active{display:block}

/* ── Account ── */
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.acc-item{background:var(--bg3);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.acc-item label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.acc-item .val{font-size:15px;font-weight:700;color:var(--green)}
.acc-item .val.neg{color:var(--red)}

/* ── Form ── */
.form-grid{display:grid;grid-template-columns:70px 1fr;gap:7px 10px;align-items:center;margin-bottom:12px}
.form-grid label{font-size:11px;color:var(--muted);text-align:right;font-weight:500}
.sym-row{display:flex;gap:6px;align-items:center}
.cur-price{font-size:11px;color:var(--yellow);font-weight:700;min-width:60px}

/* ── Positions ── */
.pos-card{height:180px;flex-shrink:0;overflow:hidden}
.pos-card .tbl-scroll{overflow-y:auto;height:calc(100% - 36px)}

/* ── Log ── */
.log-card{flex:1;display:flex;flex-direction:column;min-height:0}
.log-box{font-family:'Consolas','SF Mono',monospace;font-size:11px;overflow-y:auto;padding:8px 12px;flex:1;line-height:1.6}
.log-ok{color:var(--green)} .log-err{color:var(--red)} .log-warn{color:var(--yellow)} .log-info{color:var(--muted)}
.log-entry{margin-bottom:1px;display:flex;gap:8px}
.log-ts{color:var(--border);flex-shrink:0}

/* ── Tables ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--bg3);padding:7px 8px;text-align:center;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg3)}
.green{color:var(--green)} .red{color:var(--red)} .yellow{color:var(--yellow)} .muted{color:var(--muted)} .accent{color:var(--accent)}
.s1{color:var(--yellow)} .s2{color:var(--yellow)} .s3{color:#fb923c} .s4{color:var(--red)}

/* ── Toast ── */
#toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:12px;box-shadow:var(--shadow-md);display:none;z-index:999;max-width:280px;animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.sep{border:none;border-top:1px solid var(--border);margin:10px 0}
.tag-long{background:rgba(16,185,129,.12);color:var(--green);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
.tag-short{background:rgba(239,68,68,.12);color:var(--red);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}

/* ── Radar scan animation ── */
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.scanning-label{animation:pulse 1.2s infinite}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-logo">⚡ BINANCE FUTURES BOT</div>
  <div class="hdr-sep"></div>
  <input class="inp" id="inp-key"    type="password" placeholder="API Key"    style="width:140px">
  <input class="inp" id="inp-secret" type="password" placeholder="API Secret" style="width:140px">
  <label class="chk"><input type="checkbox" id="chk-testnet" checked> 测试网</label>
  <button class="btn btn-primary btn-sm" id="btn-connect" onclick="connect()">连 接</button>
  <span class="conn-dot err" id="conn-status">● 未连接</span>
  <div class="hdr-sep"></div>
  <div class="user-badge">👤 <span id="current-user">...</span></div>
  <button class="btn btn-ghost btn-sm" onclick="logout()">登出</button>
</div>

<!-- Body -->
<div class="body">

  <!-- 左列：雷达图 + 策略扫描 -->
  <div class="panel-left">
    <div class="card left-card">
      <div class="left-tabs">
        <div class="ltab active" onclick="switchLeft('radar')">📡 市场雷达</div>
        <div class="ltab" onclick="switchLeft('scanner')">🔍 策略扫描</div>
        <span style="margin-left:auto;font-size:10px;color:var(--muted);align-self:center" id="radar-ts"></span>
        <button class="btn btn-ghost btn-sm" style="margin-left:6px;align-self:center" onclick="loadTickers()">刷新</button>
      </div>

      <!-- 雷达图 -->
      <div class="left-panel-body" id="lpanel-radar">
        <div id="radar-chart"></div>
      </div>

      <!-- 策略扫描 -->
      <div class="left-panel-body" id="lpanel-scanner" style="display:none">
        <div class="scan-panel">
          <div class="scan-grid">
            <div class="scan-field"><label>最低信号分</label><input class="form-inp" id="s-minscore" value="2" type="number" min="1" max="4"></div>
            <div class="scan-field"><label>交易金额(U)</label><input class="form-inp" id="s-usdt" value="100"></div>
            <div class="scan-field"><label>杠杆倍数</label><input class="form-inp" id="s-lev" value="10" type="number"></div>
            <div class="scan-field"><label>止损 %</label><input class="form-inp" id="s-sl" value="2.0"></div>
            <div class="scan-field"><label>止盈 %</label><input class="form-inp" id="s-tp" value="4.0"></div>
          </div>
          <div class="mode-row">
            <span>模式:</span>
            <label><input type="radio" name="mode" value="manual" checked> 手动</label>
            <label><input type="radio" name="mode" value="auto"> 自动</label>
          </div>
          <div class="scan-ctrl">
            <button class="btn btn-primary btn-sm" id="btn-scan-start" onclick="startScan()">▶ 开始</button>
            <button class="btn btn-ghost btn-sm" id="btn-scan-stop" onclick="stopScan()" disabled>■ 停止</button>
            <span class="scan-badge" id="scan-status">未启动</span>
          </div>
          <div class="prog-wrap" id="scan-progress-wrap">
            <div class="prog-info">
              <span id="scan-progress-text">扫描中...</span>
              <span id="scan-progress-pct">0%</span>
            </div>
            <div class="prog-bar"><div class="prog-fill" id="scan-progress-bar" style="width:0%"></div></div>
          </div>
          <div class="scan-sep"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:11px;font-weight:700;color:var(--text)">扫描结果</span>
            <span style="font-size:10px;color:var(--muted)" id="scan-ts"></span>
          </div>
          <div class="tbl-wrap">
            <table id="scan-table">
              <thead><tr>
                <th>交易对</th><th>分</th><th>方向</th>
                <th>量价</th><th>RSI</th><th>动量</th><th>布林</th>
                <th>价格</th><th>操作</th>
              </tr></thead>
              <tbody id="scan-tbody"><tr><td colspan="9" class="muted" style="padding:20px">点击开始扫描</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="resizer-col" id="resizer-left"></div>

  <!-- 中列：交易 + 持仓 -->
  <div class="panel-mid">
    <div class="card right-card">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('trade')">交 易</div>
      </div>
      <div class="tab-panel active" id="tab-trade">
        <div class="tab-body">
          <div class="acc-grid">
            <div class="acc-item"><label>可用余额</label><div class="val" id="v-avail">-- USDT</div></div>
            <div class="acc-item"><label>钱包余额</label><div class="val" id="v-wallet">-- USDT</div></div>
            <div class="acc-item"><label>未实现盈亏</label><div class="val" id="v-pnl">-- USDT</div></div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="loadAccount()" style="margin-bottom:12px">刷新账户</button>
          <hr class="sep">
          <div class="form-grid">
            <label>交易对</label>
            <div class="sym-row">
              <input class="form-inp" id="f-sym" value="BTCUSDT" style="width:100px">
              <span class="cur-price" id="f-cprice">--</span>
              <button class="btn btn-ghost btn-sm" onclick="getPrice()">查价</button>
            </div>
            <label>订单类型</label>
            <select class="form-inp" id="f-otype" onchange="onOtypeChange()">
              <option>MARKET</option><option>LIMIT</option>
            </select>
            <label>杠杆</label>
            <input class="form-inp" id="f-lev" value="10" type="number" min="1" max="125">
            <label>数量</label>
            <input class="form-inp" id="f-qty" value="0.001">
            <label>限价</label>
            <input class="form-inp" id="f-lprice" disabled placeholder="仅限价单需要">
          </div>
          <div class="btn-row">
            <button class="btn btn-long" onclick="manualOrder('BUY')">做 多 ▲</button>
            <button class="btn btn-short" onclick="manualOrder('SELL')">做 空 ▼</button>
          </div>
          <button class="btn btn-warn btn-sm" onclick="cancelOrders()">撤销所有挂单</button>
        </div>
      </div>
    </div>

    <div class="resizer-row" id="resizer-mid"></div>

    <div class="card pos-card">
      <div class="card-hdr">
        <span class="title">当前持仓</span>
        <button class="btn btn-ghost btn-sm" onclick="loadPositions()" style="margin-left:auto">刷新</button>
      </div>
      <div class="pos-card tbl-scroll" style="height:calc(100% - 36px);overflow-y:auto">
        <table>
          <thead><tr>
            <th>交易对</th><th>方向</th><th>数量</th><th>开仓价</th>
            <th>标记价</th><th>盈亏</th><th>收益%</th><th>杠杆</th><th>操作</th>
          </tr></thead>
          <tbody id="pos-tbody"><tr><td colspan="9" class="muted" style="padding:14px">暂无持仓</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="resizer-col" id="resizer-right"></div>

  <!-- 右列：日志 -->
  <div class="panel-right">
    <div class="card log-card">
      <div class="card-hdr">
        <span class="title">操作日志</span>
        <button class="btn btn-ghost btn-sm" onclick="clearLog()" style="margin-left:auto">清除</button>
      </div>
      <div class="log-box" id="log-box"></div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
let radarChart = null;
let tickerData  = [];
let signalMap   = {};
let scanRunning = false;

// ── Init ─────────────────────────────────────────
window.addEventListener('load', () => {
  loadCurrentUser();
  initChart();
  loadTickers();
  loadStatus();
  loadLog();
  loadSavedConfig();
  setInterval(autoRefresh, 5000);
  setInterval(loadLog, 3000);
  setInterval(loadScanStatus, 1000);
  setInterval(loadTickers, 60000);
  initResizers();
});

// ── Auth ─────────────────────────────────────────
async function loadCurrentUser() {
  const r = await fetch('/api/auth/status').then(r=>r.json()).catch(()=>({}));
  if (r.authenticated) document.getElementById('current-user').textContent = r.username;
  else window.location.href = '/login';
}
async function logout() {
  if (!confirm('确认退出登录？')) return;
  await fetch('/api/auth/logout', {method:'POST'});
  window.location.href = '/login';
}

// ── Status / Config ───────────────────────────────
async function loadStatus() {
  const r = await fetch('/api/status').then(r=>r.json()).catch(()=>({}));
  if (r.connected) {
    setConnected(true);
    autoRefresh();
  }
}
async function loadSavedConfig() {
  const cfg = await fetch('/api/config').then(r=>r.json()).catch(()=>({}));
  if (cfg.api_key) document.getElementById('inp-key').value = cfg.api_key;
  if (cfg.testnet !== undefined) document.getElementById('chk-testnet').checked = cfg.testnet;
}
function setConnected(ok) {
  const el = document.getElementById('conn-status');
  el.className = 'conn-dot ' + (ok ? 'ok' : 'err');
  el.textContent = ok ? '● 已连接' : '● 未连接';
}

// ── Connect ───────────────────────────────────────
async function connect() {
  const key    = document.getElementById('inp-key').value.trim();
  const secret = document.getElementById('inp-secret').value.trim();
  const test   = document.getElementById('chk-testnet').checked;
  if (!key || !secret) { toast('请填写 API Key 和 Secret', 'err'); return; }
  document.getElementById('btn-connect').disabled = true;
  const r = await fetch('/api/connect', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({api_key:key, api_secret:secret, testnet:test})
  }).then(r=>r.json()).catch(()=>({ok:false,msg:'网络错误'}));
  document.getElementById('btn-connect').disabled = false;
  if (r.ok) { setConnected(true); toast('连接成功', 'ok'); autoRefresh(); }
  else toast('连接失败: ' + r.msg, 'err');
}

// ── Account ───────────────────────────────────────
async function autoRefresh() { await loadAccount(); await loadPositions(); }

async function loadAccount() {
  const r = await fetch('/api/account').then(r=>r.json()).catch(()=>({}));
  if (!r.ok) return;
  document.getElementById('v-avail').textContent  = r.available.toFixed(2) + ' USDT';
  document.getElementById('v-wallet').textContent = r.wallet.toFixed(2) + ' USDT';
  const el = document.getElementById('v-pnl');
  el.textContent = (r.pnl >= 0 ? '+' : '') + r.pnl.toFixed(2) + ' USDT';
  el.className = 'val' + (r.pnl < 0 ? ' neg' : '');
}

async function loadPositions() {
  const r = await fetch('/api/positions').then(r=>r.json()).catch(()=>({positions:[]}));
  const tb = document.getElementById('pos-tbody');
  if (!r.positions.length) {
    tb.innerHTML = '<tr><td colspan="9" class="muted" style="padding:14px">暂无持仓</td></tr>'; return;
  }
  tb.innerHTML = r.positions.map(p => `
    <tr>
      <td class="accent">${p.symbol}</td>
      <td>${p.side==='多'?'<span class="tag-long">多▲</span>':'<span class="tag-short">空▼</span>'}</td>
      <td>${p.amt.toFixed(4)}</td>
      <td>${p.entry.toFixed(4)}</td>
      <td>${p.mark.toFixed(4)}</td>
      <td class="${p.pnl>=0?'green':'red'}">${p.pnl>=0?'+':''}${p.pnl.toFixed(2)}</td>
      <td class="${p.roe>=0?'green':'red'}">${p.roe>=0?'+':''}${p.roe.toFixed(2)}%</td>
      <td>${p.leverage}x</td>
      <td><button class="btn btn-danger btn-sm" onclick="closePos('${p.symbol}')">平仓</button></td>
    </tr>`).join('');
}

// ── Trade ─────────────────────────────────────────
async function getPrice() {
  const sym = document.getElementById('f-sym').value.trim().toUpperCase();
  const r = await fetch('/api/price/'+sym).then(r=>r.json()).catch(()=>({}));
  if (r.ok) document.getElementById('f-cprice').textContent = r.price.toFixed(4);
  else toast('获取价格失败','err');
}
function onOtypeChange() {
  document.getElementById('f-lprice').disabled = document.getElementById('f-otype').value !== 'LIMIT';
}
async function manualOrder(side) {
  const sym=document.getElementById('f-sym').value.trim().toUpperCase();
  const otype=document.getElementById('f-otype').value;
  const qty=parseFloat(document.getElementById('f-qty').value);
  const lev=parseInt(document.getElementById('f-lev').value);
  const lpx=parseFloat(document.getElementById('f-lprice').value);
  const cn=side==='BUY'?'做多▲':'做空▼';
  const extra=otype==='LIMIT'?`\n限价: ${lpx}`:'';
  if (!confirm(`确认下单？\n${sym}  ${cn}\n${otype}  数量:${qty}  杠杆:${lev}x${extra}`)) return;
  const body={symbol:sym,side,type:otype,qty,leverage:lev};
  if (otype==='LIMIT') body.price=lpx;
  const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  if (r.ok){toast('下单成功 '+cn+' '+sym,'ok');autoRefresh();}
  else toast('下单失败: '+r.msg,'err');
}
async function closePos(symbol) {
  if (!confirm(`确认平仓 ${symbol}？`)) return;
  const r=await fetch('/api/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol})}).then(r=>r.json());
  if (r.ok){toast('平仓成功: '+symbol,'ok');autoRefresh();}
  else toast('平仓失败: '+r.msg,'err');
}
async function cancelOrders() {
  const sym=document.getElementById('f-sym').value.trim().toUpperCase();
  if (!confirm(`撤销 ${sym} 所有挂单？`)) return;
  const r=await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:sym})}).then(r=>r.json());
  toast(r.msg,r.ok?'ok':'err');
}

// ── Tabs ──────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['trade'][i]===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+name));
}
function switchLeft(name) {
  document.querySelectorAll('.ltab').forEach((t,i)=>t.classList.toggle('active',['radar','scanner'][i]===name));
  document.getElementById('lpanel-radar').style.display   = name==='radar'   ? 'flex' : 'none';
  document.getElementById('lpanel-scanner').style.display = name==='scanner' ? 'flex' : 'none';
  if (name==='radar' && radarChart) setTimeout(()=>radarChart.resize(), 50);
}

// ── Scanner ───────────────────────────────────────
function getScanSettings() {
  return {
    min_score:  parseInt(document.getElementById('s-minscore').value),
    trade_usdt: parseFloat(document.getElementById('s-usdt').value),
    leverage:   parseInt(document.getElementById('s-lev').value),
    sl_pct:     parseFloat(document.getElementById('s-sl').value),
    tp_pct:     parseFloat(document.getElementById('s-tp').value),
    auto_trade: document.querySelector('input[name="mode"]:checked').value==='auto',
  };
}
async function startScan() {
  const r=await fetch('/api/scan/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(getScanSettings())}).then(r=>r.json());
  if (r.ok){scanRunning=true;document.getElementById('btn-scan-start').disabled=true;document.getElementById('btn-scan-stop').disabled=false;toast('扫描已启动','ok');}
}
async function stopScan() {
  await fetch('/api/scan/stop',{method:'POST'});
  scanRunning=false;
  document.getElementById('btn-scan-start').disabled=false;
  document.getElementById('btn-scan-stop').disabled=true;
  document.getElementById('scan-status').textContent='已停止';
}
async function loadScanStatus() {
  const r=await fetch('/api/scan/status').then(r=>r.json()).catch(()=>({}));
  if (!r) return;
  scanRunning=r.running;
  document.getElementById('btn-scan-start').disabled=r.running;
  document.getElementById('btn-scan-stop').disabled=!r.running;
  const prog=r.progress||{};
  const pw=document.getElementById('scan-progress-wrap');
  if (prog.total>0) {
    const pct=Math.round(prog.current/prog.total*100);
    pw.style.display='block';
    document.getElementById('scan-progress-text').textContent=`扫描 ${prog.current}/${prog.total}: ${prog.symbol}`;
    document.getElementById('scan-progress-pct').textContent=pct+'%';
    document.getElementById('scan-progress-bar').style.width=pct+'%';
    document.getElementById('scan-status').textContent='扫描中...';
  } else {
    pw.style.display='none';
    if (r.running) document.getElementById('scan-status').textContent=`下次 ${r.countdown}`;
  }
  if (r.ts) {
    document.getElementById('scan-ts').textContent=r.ts;
    renderScanResults(r.results||[]);
    signalMap={};
    (r.results||[]).forEach(res=>{signalMap[res.symbol]=res.score;});
    if (tickerData.length) renderChart();
  }
}

function renderScanResults(results) {
  const tb=document.getElementById('scan-tbody');
  if (!results.length){tb.innerHTML='<tr><td colspan="9" class="muted" style="padding:16px">暂无信号</td></tr>';return;}
  tb.innerHTML=results.map(r=>{
    const stars='★'.repeat(r.score);
    const d=r.details;
    return `<tr>
      <td class="accent" style="font-weight:700">${r.symbol}</td>
      <td class="s${Math.min(r.score,4)}">${stars}</td>
      <td>${r.direction==='LONG'?'<span class="tag-long">多</span>':'<span class="tag-short">空</span>'}</td>
      <td class="${d.vol.cls}">${d.vol.text}</td>
      <td class="${d.rsi.cls}">${d.rsi.text}</td>
      <td class="${d.mom.cls}">${d.mom.text}</td>
      <td class="${d.bb.cls}">${d.bb.text}</td>
      <td>${r.price.toFixed(4)}</td>
      <td><button class="btn btn-primary btn-sm" onclick="tradeSignal(${JSON.stringify(r).replace(/"/g,'&quot;')})">交易</button></td>
    </tr>`;
  }).join('');
}

async function tradeSignal(signal) {
  const s=getScanSettings();
  const side=signal.direction==='LONG'?'BUY':'SELL';
  const cn=side==='BUY'?'做多▲':'做空▼';
  if (!confirm(`${signal.symbol}  ${cn}\n评分:${signal.score}  金额:${s.trade_usdt}U  杠杆:${s.leverage}x\n止损:${s.sl_pct}%  止盈:${s.tp_pct}%`)) return;
  const pr=await fetch('/api/price/'+signal.symbol).then(r=>r.json()).catch(()=>({}));
  const price=pr.price||signal.price;
  const qty=Math.round(s.trade_usdt/price*1000)/1000;
  const r=await fetch('/api/order/sltp',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({symbol:signal.symbol,side,qty,leverage:s.leverage,sl_pct:s.sl_pct,tp_pct:s.tp_pct})}).then(r=>r.json());
  if (r.ok){toast(`下单成功 ${cn} ${signal.symbol}  SL:${r.sl?.toFixed(4)}  TP:${r.tp?.toFixed(4)}`,'ok');autoRefresh();}
  else toast('下单失败: '+r.msg,'err');
}

// ── Radar Chart ───────────────────────────────────
function initChart() {
  const el=document.getElementById('radar-chart');
  radarChart=echarts.init(el,null,{renderer:'canvas'});
  window.addEventListener('resize',()=>radarChart.resize());
  radarChart.on('click',params=>{
    if (params.data) {
      const sym=params.data.value[3];
      document.getElementById('f-sym').value=sym;
      toast('已选择: '+sym,'ok');
    }
  });
}

async function loadTickers() {
  const r=await fetch('/api/tickers').then(r=>r.json()).catch(()=>({tickers:[]}));
  if (r.tickers?.length) {
    tickerData=r.tickers;
    renderChart();
    document.getElementById('radar-ts').textContent=new Date().toLocaleTimeString();
  }
}

function renderChart() {
  if (!radarChart||!tickerData.length) return;
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const bg    = dark?'#161b22':'#ffffff';
  const grid  = dark?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)';
  const muted = dark?'#7d8590':'#94a3b8';
  const label = dark?'#c8d3de':'#475569';
  const maxVol=Math.max(...tickerData.map(t=>t.vol));

  // 普通散点
  const normal=tickerData.filter(t=>!(signalMap[t.symbol]>=2)).map(t=>{
    const size=Math.max(5,Math.min(32,t.vol/maxVol*32));
    const alpha=0.45+Math.min(Math.abs(t.chg)/20,.45);
    const color=t.chg>0?`rgba(16,185,129,${alpha})`:`rgba(239,68,68,${alpha})`;
    return {value:[t.chg,t.vol,size,t.symbol,0],itemStyle:{color},symbolSize:size};
  });

  // 信号散点（动态脉冲）
  const signals=tickerData.filter(t=>signalMap[t.symbol]>=2).map(t=>{
    const score=signalMap[t.symbol];
    const size=Math.max(14,Math.min(40,t.vol/maxVol*40));
    const color=score>=4?'#f85149':score>=3?'#fb923c':'#ffd60a';
    return {value:[t.chg,t.vol,size,t.symbol,score],itemStyle:{color},symbolSize:size*1.4};
  });

  // 标签（前25个+信号）
  const labelSymbols=new Set([...tickerData.slice(0,20).map(t=>t.symbol),...Object.keys(signalMap)]);
  const markPoints=tickerData.filter(t=>labelSymbols.has(t.symbol)).map(t=>({
    coord:[t.chg,t.vol],
    value:(signalMap[t.symbol]>=2?'★':'')+t.symbol.replace('USDT',''),
    label:{show:true,position:'right',fontSize:9,
      color:signalMap[t.symbol]>=2?'#ffd60a':label,
      fontWeight:signalMap[t.symbol]>=2?'bold':'normal'}
  }));

  radarChart.setOption({
    animation:true,
    backgroundColor:bg,
    grid:{left:50,right:16,top:24,bottom:36},
    xAxis:{type:'value',name:'涨跌幅%',
      nameTextStyle:{color:muted,fontSize:10},
      axisLine:{lineStyle:{color:grid}},
      splitLine:{lineStyle:{color:grid,type:'dashed'}},
      axisLabel:{color:muted,fontSize:9}},
    yAxis:{type:'value',name:'成交额(亿)',
      nameTextStyle:{color:muted,fontSize:10},
      axisLine:{lineStyle:{color:grid}},
      splitLine:{lineStyle:{color:grid,type:'dashed'}},
      axisLabel:{color:muted,fontSize:9}},
    tooltip:{trigger:'item',backgroundColor:bg,borderColor:dark?'#30363d':'#e2e8f0',textStyle:{color:dark?'#e6edf3':'#1e293b',fontSize:11},
      formatter:p=>{
        const[chg,vol,,sym,score]=p.data.value;
        return `<b>${sym}</b><br>涨跌: ${chg.toFixed(2)}%<br>成交: ${vol.toFixed(1)}亿${score?`<br>信号: ${'★'.repeat(score)}`:''}`;
      }},
    series:[
      {type:'scatter',data:normal,z:1,
        emphasis:{itemStyle:{borderColor:'#fff',borderWidth:1}}},
      {type:'effectScatter',data:signals,z:3,
        rippleEffect:{brushType:'stroke',scale:3,period:2},
        showEffectOn:'render',
        emphasis:{scale:true},
        markPoint:{data:markPoints,symbol:'none'}},
    ]
  },true);
}

// ── Log ───────────────────────────────────────────
async function loadLog() {
  const r=await fetch('/api/log').then(r=>r.json()).catch(()=>({log:[]}));
  const box=document.getElementById('log-box');
  box.innerHTML=r.log.map(l=>`<div class="log-entry"><span class="log-ts">[${l.ts}]</span><span class="log-${l.level}">${l.msg}</span></div>`).join('');
}
function clearLog() { document.getElementById('log-box').innerHTML=''; }

// ── Toast ─────────────────────────────────────────
let toastTimer;
function toast(msg,type='info') {
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.style.display='block';
  el.style.color=type==='ok'?'var(--green)':type==='err'?'var(--red)':'var(--text)';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display='none',3000);
}

// ── Resizable Panels ──────────────────────────────
function initResizers() {
  // 左列宽度
  const r1=document.getElementById('resizer-left');
  const pl=document.querySelector('.panel-left');
  r1.addEventListener('mousedown',e=>{
    e.preventDefault();
    const sx=e.clientX,sw=pl.offsetWidth;
    r1.classList.add('dragging');
    document.body.style.cssText='cursor:col-resize;user-select:none';
    const mv=e=>{pl.style.width=Math.max(200,sw+e.clientX-sx)+'px';if(radarChart)radarChart.resize();};
    const up=()=>{r1.classList.remove('dragging');document.body.style.cssText='';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);if(radarChart)radarChart.resize();};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
  // 右列宽度
  const r2=document.getElementById('resizer-right');
  const pr=document.querySelector('.panel-right');
  r2.addEventListener('mousedown',e=>{
    e.preventDefault();
    const sx=e.clientX,sw=pr.offsetWidth;
    r2.classList.add('dragging');
    document.body.style.cssText='cursor:col-resize;user-select:none';
    const mv=e=>{pr.style.width=Math.max(160,sw-(e.clientX-sx))+'px';};
    const up=()=>{r2.classList.remove('dragging');document.body.style.cssText='';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
  // 中列上下
  const r3=document.getElementById('resizer-mid');
  const rc=document.querySelector('.right-card');
  r3.addEventListener('mousedown',e=>{
    e.preventDefault();
    const sy=e.clientY,sh=rc.offsetHeight;
    r3.classList.add('dragging');
    document.body.style.cssText='cursor:row-resize;user-select:none';
    const mv=e=>{rc.style.flex='none';rc.style.height=Math.max(120,sh+e.clientY-sy)+'px';};
    const up=()=>{r3.classList.remove('dragging');document.body.style.cssText='';document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  });
}
</script>
