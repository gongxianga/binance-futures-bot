<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>币安合约交易系统 v4.0</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root {
  --bg:      #0d0a06;
  --bg2:     #13100a;
  --bg3:     #1a1510;
  --bg4:     #221c14;
  --panel:   rgba(19,16,10,.95);
  --border:  rgba(255,160,30,.2);
  --border2: rgba(255,160,30,.1);
  --text:    #f5e6c8;
  --muted:   #7a6040;
  --gold:    #ffb830;
  --orange:  #ff7a20;
  --red:     #ff3a3a;
  --green:   #52e87a;
  --amber:   #ffd060;
  --brown:   #c47a30;
  --glow-g:  0 0 8px rgba(255,184,48,.55);
  --glow-o:  0 0 8px rgba(255,122,32,.55);
  --glow-r:  0 0 8px rgba(255,58,58,.55);
  --glow-gr: 0 0 8px rgba(82,232,122,.5);
  --shadow:  0 4px 32px rgba(0,0,0,.85);
  --font-mono: 'Consolas','SF Mono','Courier New',monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 背景纹理 */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(255,160,30,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,160,30,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: grid-drift 25s linear infinite;
}
@keyframes grid-drift { 0%{background-position:0 0} 100%{background-position:40px 40px} }

body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,140,20,.008) 3px, rgba(255,140,20,.008) 4px);
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(255,160,30,.3); border-radius: 2px; }

/* ── 顶栏 ── */
.hdr {
  position: relative; z-index: 10;
  background: linear-gradient(90deg, var(--bg2), rgba(255,120,20,.05) 50%, var(--bg2));
  border-bottom: 1px solid var(--border);
  padding: 0 18px;
  display: flex; align-items: center; gap: 12px;
  height: 56px; flex-shrink: 0;
  box-shadow: 0 2px 30px rgba(255,120,20,.08), inset 0 -1px 0 rgba(255,160,30,.15);
}
.logo-box { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 36px; height: 36px; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(255,184,48,.15), rgba(255,122,32,.25));
  border: 1px solid rgba(255,184,48,.5);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 17px;
  box-shadow: var(--glow-g), inset 0 0 10px rgba(255,184,48,.08);
  animation: logo-glow 3s ease-in-out infinite;
}
@keyframes logo-glow {
  0%,100% { box-shadow: var(--glow-g), inset 0 0 10px rgba(255,184,48,.08); }
  50%      { box-shadow: 0 0 20px rgba(255,184,48,.7), inset 0 0 18px rgba(255,184,48,.15); }
}
.logo-title { font-size: 14px; font-weight: 700; color: var(--gold); letter-spacing: 2px; text-shadow: var(--glow-g); }
.logo-sub   { font-size: 10px; color: var(--muted); letter-spacing: 1px; font-family: var(--font-mono); }
.hdr-sep    { width: 1px; height: 28px; background: var(--border2); flex-shrink: 0; }
.hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.inp {
  background: rgba(255,160,30,.05); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 11px; color: var(--text);
  font-size: 12px; outline: none; transition: all .2s; font-family: var(--font-mono);
}
.inp:focus { border-color: var(--gold); background: rgba(255,184,48,.08); box-shadow: 0 0 0 2px rgba(255,184,48,.15); }
.inp::placeholder { color: var(--muted); }

.chk { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.chk:hover { color: var(--gold); }

.status-badge {
  font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 4px;
  font-family: var(--font-mono); letter-spacing: 1px;
}
.status-badge.ok  {
  color: var(--green); background: rgba(82,232,122,.08); border: 1px solid rgba(82,232,122,.3);
  box-shadow: var(--glow-gr); animation: blink-green 2s ease-in-out infinite;
}
.status-badge.err { color: var(--red); background: rgba(255,58,58,.08); border: 1px solid rgba(255,58,58,.25); }
@keyframes blink-green { 0%,100%{box-shadow:var(--glow-gr)} 50%{box-shadow:0 0 18px rgba(82,232,122,.7)} }

.user-chip {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,160,30,.06); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 11px; font-size: 11px;
  font-family: var(--font-mono); color: var(--gold);
}
.user-dot {
  width: 6px; height: 6px; background: var(--green);
  border-radius: 50%; box-shadow: var(--glow-gr);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* ── 主体 ── */
.body {
  position: relative; z-index: 1;
  display: flex; flex-direction: row;
  padding: 8px; gap: 0;
  flex: 1; overflow: hidden; min-height: 0;
}

.panel-left  { width: 295px; min-width: 220px; display: flex; flex-direction: column; flex-shrink: 0; gap: 7px; }
.panel-main  { flex: 1; min-width: 380px; display: flex; flex-direction: column; overflow: hidden; }
.panel-right { width: 255px; min-width: 180px; flex-shrink: 0; display: flex; flex-direction: column; }

/* 分隔条 */
.resizer-col {
  width: 10px; cursor: col-resize; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.resizer-col::after {
  content: ''; width: 2px; height: 48px;
  background: var(--border2); border-radius: 1px; transition: all .2s;
}
.resizer-col:hover::after, .resizer-col.dragging::after { background: var(--gold); height: 64px; box-shadow: var(--glow-g); }
.resizer-row {
  height: 10px; cursor: row-resize; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.resizer-row::after {
  content: ''; height: 2px; width: 48px;
  background: var(--border2); border-radius: 1px; transition: all .2s;
}
.resizer-row:hover::after, .resizer-row.dragging::after { background: var(--gold); width: 64px; box-shadow: var(--glow-g); }

/* ── 卡片 ── */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  box-shadow: var(--shadow), inset 0 0 40px rgba(255,160,30,.015);
  backdrop-filter: blur(8px); position: relative;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .35;
}
.card-hdr {
  padding: 9px 14px; font-size: 10px; font-weight: 700;
  color: var(--gold); border-bottom: 1px solid var(--border2);
  display: flex; align-items: center; gap: 8px;
  letter-spacing: 2px; text-transform: none;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: rgba(255,160,30,.03);
}
.hdr-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); box-shadow: var(--glow-g);
  animation: blink 2s ease-in-out infinite;
}
.hdr-dot.green  { background: var(--green);  box-shadow: var(--glow-gr); }
.hdr-dot.orange { background: var(--orange); box-shadow: var(--glow-o); }
.hdr-dot.off    { background: var(--muted);  box-shadow: none; animation: none; }
.card-hdr-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }

/* ── 账户卡片 ── */
.acc-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 12px; }
.acc-chip {
  background: rgba(255,160,30,.04); border: 1px solid var(--border2);
  border-radius: 6px; padding: 10px 10px 8px; position: relative; overflow: hidden;
}
.acc-chip::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .25;
}
.acc-chip label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 5px; letter-spacing: 1px; }
.acc-chip .val { font-size: 14px; font-weight: 700; color: var(--green); font-family: var(--font-mono); text-shadow: var(--glow-gr); }
.acc-chip .val.neg     { color: var(--red);  text-shadow: var(--glow-r); }
.acc-chip .val.neutral { color: var(--gold); text-shadow: var(--glow-g); }

/* ── 表单 ── */
.form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.form-row label { font-size: 11px; color: var(--muted); width: 60px; text-align: right; flex-shrink: 0; }
.form-inp {
  flex: 1; background: rgba(255,160,30,.04); border: 1px solid var(--border);
  border-radius: 5px; padding: 7px 10px; color: var(--text);
  font-size: 12px; outline: none; transition: all .2s; font-family: var(--font-mono);
}
.form-inp:focus { border-color: var(--gold); background: rgba(255,184,48,.07); box-shadow: 0 0 0 2px rgba(255,184,48,.12); }
.form-inp::placeholder { color: var(--muted); }
select.form-inp { cursor: pointer; }
select.form-inp option { background: var(--bg3); }
.sym-row { flex: 1; display: flex; gap: 6px; align-items: center; }
.cur-price {
  font-family: var(--font-mono); font-size: 20px; font-weight: 700;
  color: var(--amber); text-align: center; margin: -2px 0 10px;
  text-shadow: 0 0 12px rgba(255,208,96,.6); letter-spacing: 1px;
}

/* ── 按钮 ── */
.btn {
  border: 1px solid transparent; border-radius: 5px; padding: 7px 14px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all .18s; white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.15); }
.btn:active { transform: translateY(0); filter: brightness(.9); }
.btn:disabled { opacity: .3; cursor: default; transform: none; filter: none; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-long {
  background: rgba(82,232,122,.1); color: var(--green);
  border-color: rgba(82,232,122,.35); box-shadow: var(--glow-gr);
}
.btn-long:hover { background: rgba(82,232,122,.18); box-shadow: 0 0 18px rgba(82,232,122,.55); }
.btn-short {
  background: rgba(255,58,58,.1); color: var(--red);
  border-color: rgba(255,58,58,.35); box-shadow: var(--glow-r);
}
.btn-short:hover { background: rgba(255,58,58,.18); box-shadow: 0 0 18px rgba(255,58,58,.55); }
.btn-primary {
  background: rgba(255,184,48,.1); color: var(--gold);
  border-color: rgba(255,184,48,.4); box-shadow: var(--glow-g);
}
.btn-primary:hover { background: rgba(255,184,48,.18); box-shadow: 0 0 18px rgba(255,184,48,.55); }
.btn-ghost { background: rgba(255,160,30,.05); color: var(--muted); border-color: var(--border); }
.btn-ghost:hover { color: var(--gold); border-color: var(--gold); }
.btn-warn { background: rgba(255,122,32,.08); color: var(--orange); border-color: rgba(255,122,32,.3); }
.btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 4px; }
.sep { border: none; border-top: 1px solid var(--border2); margin: 10px 0; }

/* ── 主区域 ── */
.main-top { flex: 1; display: flex; flex-direction: row; gap: 0; overflow: hidden; min-height: 0; }
.radar-card   { width: 44%; min-width: 260px; flex-shrink: 0; display: flex; flex-direction: column; }
.scanner-card { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* 雷达 */
.radar-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#radar-chart { width: 100%; height: 100%; }
.radar-ring {
  position: absolute; border-radius: 50%; border: 1px solid;
  pointer-events: none; top: 50%; left: 50%;
}
.radar-ring:nth-child(1) { width: 80px;  height: 80px;  margin: -40px 0 0 -40px;  border-color: rgba(255,184,48,.4);  animation: rpulse 3.2s ease-out infinite; }
.radar-ring:nth-child(2) { width: 160px; height: 160px; margin: -80px 0 0 -80px;  border-color: rgba(255,184,48,.22); animation: rpulse 3.2s ease-out infinite .8s; }
.radar-ring:nth-child(3) { width: 250px; height: 250px; margin:-125px 0 0 -125px; border-color: rgba(255,184,48,.12); animation: rpulse 3.2s ease-out infinite 1.6s; }
.radar-ring:nth-child(4) { width: 340px; height: 340px; margin:-170px 0 0 -170px; border-color: rgba(255,184,48,.05); animation: rpulse 3.2s ease-out infinite 2.4s; }
@keyframes rpulse { 0%{opacity:.9;transform:scale(.8)} 100%{opacity:0;transform:scale(1.4)} }

.scan-sweep {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: conic-gradient(from 0deg at 50% 50%,
    transparent 0deg, rgba(255,184,48,.04) 20deg, rgba(255,184,48,.1) 40deg, transparent 60deg);
  animation: sweep 4s linear infinite;
  display: none; pointer-events: none;
}
.scan-sweep.active { display: block; }
@keyframes sweep { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* 扫描设置 */
.scan-settings-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-bottom: 9px; }
.scan-field label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.scan-ctrl { display: flex; gap: 8px; align-items: center; }
.countdown { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.progress-wrap { flex: 1; }
.progress-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 4px; font-family: var(--font-mono); }
.progress-bar-bg { background: rgba(255,160,30,.06); border: 1px solid var(--border2); border-radius: 2px; height: 4px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--orange)); border-radius: 2px; width: 0%; transition: width .3s; box-shadow: var(--glow-g); }

/* 信号卡片 */
.signal-grid { display: flex; flex-direction: column; gap: 5px; }
.signal-card {
  background: rgba(255,160,30,.03); border: 1px solid var(--border2);
  border-radius: 6px; padding: 9px 12px;
  display: flex; align-items: center; gap: 9px;
  transition: all .2s; position: relative; overflow: hidden;
}
.signal-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; bottom: 0; }
.signal-card.long  { border-color: rgba(82,232,122,.2); }
.signal-card.long::before  { background: var(--green); box-shadow: var(--glow-gr); }
.signal-card.short { border-color: rgba(255,58,58,.2); }
.signal-card.short::before { background: var(--red); box-shadow: var(--glow-r); }
.signal-card:hover { background: rgba(255,184,48,.05); border-color: rgba(255,184,48,.3); transform: translateX(3px); }
.sig-sym { font-size: 13px; font-weight: 700; color: var(--gold); min-width: 76px; font-family: var(--font-mono); text-shadow: var(--glow-g); }
.sig-dir { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 3px; }
.sig-dir.long  { background: rgba(82,232,122,.1); color: var(--green); border: 1px solid rgba(82,232,122,.3); }
.sig-dir.short { background: rgba(255,58,58,.1);  color: var(--red);   border: 1px solid rgba(255,58,58,.3); }
.sig-stars { color: var(--amber); font-size: 13px; letter-spacing: -1px; text-shadow: 0 0 8px rgba(255,208,96,.6); }
.sig-price { font-size: 11px; color: var(--muted); margin-left: auto; font-family: var(--font-mono); }
.sig-tags  { display: flex; gap: 4px; flex-wrap: wrap; }
.sig-tag { font-size: 9px; padding: 2px 6px; border-radius: 3px; background: rgba(255,160,30,.05); color: var(--muted); border: 1px solid var(--border2); }
.sig-tag.up { background: rgba(82,232,122,.08);  color: var(--green); border-color: rgba(82,232,122,.25); }
.sig-tag.dn { background: rgba(255,58,58,.08);   color: var(--red);   border-color: rgba(255,58,58,.25); }
.sig-trade { flex-shrink: 0; }
.empty-state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 12px; }
.empty-icon  { font-size: 28px; margin-bottom: 8px; opacity: .35; display: block; }

/* 持仓 */
.positions-card { flex-shrink: 0; height: 165px; overflow: hidden; }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: var(--font-mono); }
th {
  background: rgba(255,160,30,.04); padding: 6px 8px;
  text-align: center; font-weight: 700; color: var(--gold);
  white-space: nowrap; border-bottom: 1px solid var(--border2);
  font-size: 10px; letter-spacing: .5px;
}
td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--border2); white-space: nowrap; }
tr:hover td { background: rgba(255,160,30,.03); }
.green  { color: var(--green); text-shadow: var(--glow-gr); }
.red    { color: var(--red);   text-shadow: var(--glow-r); }
.yellow { color: var(--amber); }
.muted  { color: var(--muted); }
.accent { color: var(--gold);  text-shadow: var(--glow-g); font-weight: 700; }

/* 日志 */
.log-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.log-box {
  font-family: var(--font-mono); font-size: 11px;
  overflow-y: auto; padding: 10px 12px; flex: 1; line-height: 1.7;
  color: rgba(255,184,48,.55);
}
.log-entry { margin-bottom: 0; }
.ts { color: rgba(255,160,30,.2); margin-right: 6px; font-size: 10px; }
.log-box .ok   { color: var(--green); }
.log-box .err  { color: var(--red); text-shadow: var(--glow-r); }
.log-box .warn { color: var(--amber); }
.log-box .info { color: rgba(255,184,48,.45); }

/* Toast */
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 16px; font-size: 12px;
  font-family: var(--font-mono);
  box-shadow: var(--shadow), var(--glow-g);
  display: none; z-index: 999; max-width: 320px;
  animation: slideUp .2s ease;
}
@keyframes slideUp { from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1} }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="hdr">
  <div class="logo-box">
    <div class="logo-icon">&#9889;</div>
    <div>
      <div class="logo-title">币安合约交易系统</div>
      <div class="logo-sub">v4.0 &nbsp;&#9679;&nbsp; FUTURES BOT</div>
    </div>
  </div>

  <div class="hdr-sep"></div>

<!-- 主体 -->
<div class="body">

  <!-- 左栏：账户 + 交易 -->
  <div class="panel-left">

    <div class="card">
      <div class="card-hdr">
        <div class="hdr-dot green"></div> 账户状态
        <div class="card-hdr-r">
          <button class="btn btn-ghost btn-sm" onclick="loadAccount()">刷新</button>
        </div>

        <div class="acc-chip"><label>可用余额</label><div class="val" id="v-avail">--</div></div>
        <div class="acc-chip"><label>钱包余额</label><div class="val neutral" id="v-wallet">--</div></div>
        <div class="acc-chip"><label>未实现盈亏</label><div class="val" id="v-pnl">--</div></div>

    <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="card-hdr">
        <div class="hdr-dot"></div> 手动下单

        <div class="form-row">
          <label>交易对</label>

            <button class="btn btn-ghost btn-sm" onclick="getPrice()">报价</button>

        <div class="cur-price" id="f-cprice">--</div>
        <div class="form-row">

            <option>MARKET</option><option>LIMIT</option>

          <label>杠杆倍数</label>
          <input class="form-inp" id="f-lev" value="10" type="number" min="1" max="125">

        <div class="form-row">
          <label>数量</label>
          <input class="form-inp" id="f-qty" value="0.001">
        </div>
        <div class="form-row">
          <label>限价</label>
          <input class="form-inp" id="f-lprice" disabled placeholder="仅限价单填写">
        </div>
        <div class="btn-row" style="margin-bottom:9px">
          <button class="btn btn-long"  onclick="manualOrder('BUY')">&#9650; 做 多</button>
          <button class="btn btn-short" onclick="manualOrder('SELL')">&#9660; 做 空</button>
        </div>
        <button class="btn btn-warn btn-sm" style="width:100%" onclick="cancelOrders()">撤销当前交易对全部挂单</button>

  </div>

  <div class="resizer-col" id="resizer-left"></div>

  <!-- 中栏：雷达 + 扫描 (上) + 持仓 (下) -->
  <div class="panel-main">

    <div class="main-top">

      <!-- 市场雷达 -->
      <div class="card radar-card">
        <div class="card-hdr">
          <div class="hdr-dot" id="radar-dot"></div> 市场雷达
          <span style="font-size:9px;color:var(--muted);font-weight:400" id="radar-ts"></span>
          <div class="card-hdr-r">
            <button class="btn btn-ghost btn-sm" onclick="loadTickers()">刷新</button>
          </div>
        </div>
        <div class="radar-wrap">
          <div id="radar-chart"></div>
          <div class="radar-ring"></div>
          <div class="radar-ring"></div>
          <div class="radar-ring"></div>
          <div class="radar-ring"></div>
          <div class="scan-sweep" id="scan-sweep"></div>
        </div>
      </div>

      <div class="resizer-col" id="resizer-inner"></div>

      <!-- 策略扫描 -->
      <div class="card scanner-card">
        <div class="card-hdr">
          <div class="hdr-dot off" id="scan-dot"></div>
          策略扫描
          <span style="font-size:9px;color:var(--muted);font-weight:400" id="scan-ts"></span>

          <!-- 参数设置 -->
          <div style="padding:10px 12px 8px;border-bottom:1px solid var(--border2);background:rgba(255,160,30,.02)">
            <div class="scan-settings-grid">
              <div class="scan-field">
                <label>最低信号分</label>
                <input class="form-inp" id="s-minscore" value="2" type="number" min="1" max="4">
              </div>
              <div class="scan-field">
                <label>每笔金额 (USDT)</label>
                <input class="form-inp" id="s-usdt" value="100">
              </div>
              <div class="scan-field">
                <label>杠杆倍数</label>
                <input class="form-inp" id="s-lev" value="10" type="number">
              </div>
              <div class="scan-field">
                <label>止损 %</label>
                <input class="form-inp" id="s-sl" value="2.0">
              </div>
              <div class="scan-field">
                <label>止盈 %</label>
                <input class="form-inp" id="s-tp" value="4.0">
              </div>
              <div class="scan-field" style="display:flex;flex-direction:column;justify-content:flex-end">
                <label>执行模式</label>
                <select class="form-inp" id="s-mode">
                  <option value="manual">手动确认</option>
                  <option value="auto">全自动</option>
                </select>

              <button class="btn btn-ghost btn-sm"   id="btn-scan-stop"  onclick="stopScan()" disabled>&#9632; 停止</button>

                  <div class="progress-bar" id="scan-progress-bar"></div>

              <span class="empty-icon">&#128225;</span>
              点击「开始扫描」启动策略雷达

    <!-- 持仓 -->
    <div class="card positions-card">
      <div class="card-hdr">

          <button class="btn btn-ghost btn-sm" onclick="loadPositions()">刷新</button>
        </div>

        <table>
          <thead><tr>
            <th>交易对</th><th>方向</th><th>数量</th><th>开仓价</th>
            <th>标记价</th><th>未实现盈亏</th><th>收益率%</th><th>杠杆</th><th>操作</th>
          </tr></thead>
          <tbody id="pos-tbody">
            <tr><td colspan="9" class="muted" style="padding:18px">暂无持仓</td></tr>
          </tbody>

  <!-- 右栏：日志 -->
  <div class="panel-right">
    <div class="card log-panel">
      <div class="card-hdr">
        <div class="hdr-dot orange"></div> 操作日志
        <div class="card-hdr-r">
          <button class="btn btn-ghost btn-sm" onclick="clearLog()">清空</button>
        </div>
      </div>
      <div class="log-box" id="log-box">
        <div class="log-entry"><span class="ts">[--:--:--]</span><span class="info">系统初始化中...</span></div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
let radarChart  = null;
let tickerData  = [];
let signalMap   = {};
let scanRunning = false;

window.addEventListener('load', () => {
  loadCurrentUser();
  initChart();
  loadTickers();
  loadStatus();
  loadLog();
  loadSavedConfig();
  setInterval(autoRefresh,    5000);
  setInterval(loadLog,        3000);
  setInterval(loadScanStatus, 1000);
  setInterval(loadTickers,   60000);
  initResizers();
});

async function loadCurrentUser() {
  const r = await fetch('/api/auth/status').then(r => r.json()).catch(() => ({}));
  if (r.authenticated) {
    document.getElementById('current-user').textContent = r.username;
  } else {
    window.location.href = '/login';
  }
}
async function logout() {
  if (!confirm('确认退出登录？')) return;
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}
async function loadStatus() {
  const r = await fetch('/api/status').then(r => r.json()).catch(() => ({}));
  if (r.connected) { setConnected(true); autoRefresh(); }
}
async function loadSavedConfig() {
  const cfg = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
  if (cfg.api_key) document.getElementById('inp-key').value = cfg.api_key;
  if (cfg.testnet !== undefined) document.getElementById('chk-testnet').checked = cfg.testnet;
}
async function connect() {
  const key    = document.getElementById('inp-key').value.trim();
  const secret = document.getElementById('inp-secret').value.trim();
  const test   = document.getElementById('chk-testnet').checked;
  if (!key || !secret) { toast('请填写 API Key 和 Secret', 'err'); return; }
  const btn = document.getElementById('btn-connect');
  btn.disabled = true; btn.textContent = '连接中...';
  const r = await fetch('/api/connect', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ api_key: key, api_secret: secret, testnet: test })
  }).then(r => r.json());
  btn.disabled = false; btn.textContent = '连 接';
  if (r.ok) { setConnected(true); toast('连接成功', 'ok'); autoRefresh(); }
  else { setConnected(false); toast('连接失败: ' + r.msg, 'err'); }
}
function setConnected(ok) {
  const el = document.getElementById('conn-status');
  el.className   = 'status-badge ' + (ok ? 'ok' : 'err');
  el.textContent = ok ? '● 已连接' : '● 未连接';
}
async function autoRefresh() { await loadAccount(); await loadPositions(); }
async function loadAccount() {
  const r = await fetch('/api/account').then(r => r.json()).catch(() => ({}));
  if (!r.ok) return;
  document.getElementById('v-avail').textContent  = r.available.toFixed(2) + ' U';
  document.getElementById('v-wallet').textContent = r.wallet.toFixed(2) + ' U';
  const el = document.getElementById('v-pnl');
  el.textContent = (r.pnl >= 0 ? '+' : '') + r.pnl.toFixed(2) + ' U';
  el.className   = 'val ' + (r.pnl >= 0 ? '' : 'neg');
}
async function loadPositions() {
  const r = await fetch('/api/positions').then(r => r.json()).catch(() => ({ positions: [] }));
  const tbody = document.getElementById('pos-tbody');
  if (!r.positions.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="muted" style="padding:16px">暂无持仓</td></tr>'; return;
  }
  tbody.innerHTML = r.positions.map(p => `
    <tr>
      <td class="accent">${p.symbol}</td>
      <td class="${p.side==='多'?'green':'red'}">${p.side==='多'?'多 ▲':'空 ▼'}</td>
      <td>${p.amt.toFixed(4)}</td><td>${p.entry.toFixed(4)}</td><td>${p.mark.toFixed(4)}</td>
      <td class="${p.pnl>=0?'green':'red'}">${p.pnl>=0?'+':''}${p.pnl.toFixed(2)}</td>
      <td class="${p.roe>=0?'green':'red'}">${p.roe>=0?'+':''}${p.roe.toFixed(2)}%</td>
      <td style="color:var(--amber)">${p.leverage}x</td>
      <td><button class="btn btn-short btn-sm" onclick="closePos('${p.symbol}')">平仓</button></td>
    </tr>`).join('');
}
async function getPrice() {
  const sym = document.getElementById('f-sym').value.trim().toUpperCase();
  const r = await fetch('/api/price/' + sym).then(r => r.json()).catch(() => ({}));
  if (r.ok) document.getElementById('f-cprice').textContent = r.price.toFixed(4);
  else toast('报价失败: ' + (r.msg || '请检查交易对名称'), 'err');
}
function onOtypeChange() {
  document.getElementById('f-lprice').disabled = document.getElementById('f-otype').value !== 'LIMIT';
}
async function manualOrder(side) {
  const sym   = document.getElementById('f-sym').value.trim().toUpperCase();
  const otype = document.getElementById('f-otype').value;
  const qty   = parseFloat(document.getElementById('f-qty').value);
  const lev   = parseInt(document.getElementById('f-lev').value);
  const lpx   = parseFloat(document.getElementById('f-lprice').value);
  const cn    = side === 'BUY' ? '做多(买入)' : '做空(卖出)';
  const extra = otype === 'LIMIT' ? '\n限价: ' + lpx : '';
  if (!confirm('确认下单？\n交易对: ' + sym + '\n方向: ' + cn + '\n类型: ' + otype + '\n数量: ' + qty + '\n杠杆: ' + lev + 'x' + extra)) return;
  const body = { symbol: sym, side, type: otype, qty, leverage: lev };
  if (otype === 'LIMIT') body.price = lpx;
  const r = await fetch('/api/order', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(r => r.json());
  if (r.ok) { toast('下单成功 ' + cn + ' ' + sym, 'ok'); autoRefresh(); }
  else toast('下单失败: ' + r.msg, 'err');
}
async function closePos(symbol) {
  if (!confirm('确认平仓 ' + symbol + '？')) return;
  const r = await fetch('/api/close', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbol })
  }).then(r => r.json());
  if (r.ok) { toast('平仓成功: ' + symbol, 'ok'); autoRefresh(); }
  else toast('平仓失败: ' + r.msg, 'err');
}
async function cancelOrders() {
  const sym = document.getElementById('f-sym').value.trim().toUpperCase();
  if (!confirm('撤销 ' + sym + ' 所有挂单？')) return;
  const r = await fetch('/api/cancel', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ symbol: sym })
  }).then(r => r.json());
  toast(r.msg, r.ok ? 'ok' : 'err');
}
function getScanSettings() {
  return {
    min_score:  parseInt(document.getElementById('s-minscore').value),
    trade_usdt: parseFloat(document.getElementById('s-usdt').value),
    leverage:   parseInt(document.getElementById('s-lev').value),
    sl_pct:     parseFloat(document.getElementById('s-sl').value),
    tp_pct:     parseFloat(document.getElementById('s-tp').value),
    auto_trade: document.getElementById('s-mode').value === 'auto',
  };
}
function setScanActive(active) {
  document.getElementById('btn-scan-start').disabled = active;
  document.getElementById('btn-scan-stop').disabled  = !active;
  const sweep = document.getElementById('scan-sweep');
  const dot   = document.getElementById('scan-dot');
  if (active) { sweep.classList.add('active'); dot.className = 'hdr-dot'; }
  else        { sweep.classList.remove('active'); dot.className = 'hdr-dot off'; }
}
async function startScan() {
  const r = await fetch('/api/scan/start', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(getScanSettings())
  }).then(r => r.json());
  if (r.ok) { scanRunning = true; setScanActive(true); toast('扫描已启动', 'ok'); }
}
async function stopScan() {
  await fetch('/api/scan/stop', { method: 'POST' });
  scanRunning = false; setScanActive(false);
  document.getElementById('scan-status').textContent = '未启动';
}
async function loadScanStatus() {
  const r = await fetch('/api/scan/status').then(r => r.json()).catch(() => ({}));
  if (!r) return;
  scanRunning = r.running;
  setScanActive(r.running);
  const prog = r.progress || {};
  const wrap = document.getElementById('scan-progress-wrap');
  if (prog.total > 0) {
    const pct = Math.round(prog.current / prog.total * 100);
    wrap.style.display = 'block';
    document.getElementById('scan-progress-text').textContent = prog.current + '/' + prog.total + ' ' + prog.symbol;
    document.getElementById('scan-progress-pct').textContent  = pct + '%';
    document.getElementById('scan-progress-bar').style.width  = pct + '%';
    document.getElementById('scan-status').textContent = '实时扫描中...';
  } else {
    wrap.style.display = 'none';
    if (r.running) document.getElementById('scan-status').textContent = '实时扫描中...';
  }
  if (r.ts) {
    document.getElementById('scan-ts').textContent = r.ts;
    renderSignals(r.results || []);
    signalMap = {};
    (r.results || []).forEach(s => { signalMap[s.symbol] = s.score; });
    if (tickerData.length) renderChart();
  }
}
function renderSignals(results) {
  const empty = document.getElementById('scan-empty');
  const grid  = document.getElementById('scan-signals');
  if (!results.length) { empty.style.display = 'block'; grid.innerHTML = ''; return; }
  empty.style.display = 'none';
  grid.innerHTML = results.map(r => {
    const isLong = r.direction === 'LONG';
    const d = r.details;
    const tc = c => c === 'green' ? 'up' : c === 'red' ? 'dn' : '';
    const tags = [
      '<span class="sig-tag ' + tc(d.vol.cls) + '">量价 ' + (d.vol.text||'') + '</span>',
      '<span class="sig-tag ' + tc(d.rsi.cls) + '">RSI ' + (d.rsi.text||'') + '</span>',
      '<span class="sig-tag ' + tc(d.mom.cls) + '">动量 ' + (d.mom.text||'') + '</span>',
      '<span class="sig-tag ' + tc(d.bb.cls)  + '">BB '  + (d.bb.text ||'') + '</span>',
    ].join('');
    const safeR = JSON.stringify(r).replace(/"/g, '&quot;');
    return '<div class="signal-card ' + (isLong ? 'long' : 'short') + '">' +
      '<div class="sig-sym">' + r.symbol.replace('USDT','') + '<span style="color:var(--muted);font-size:9px">/U</span></div>' +
      '<div class="sig-dir ' + (isLong ? 'long' : 'short') + '">' + (isLong ? '▲ 多' : '▼ 空') + '</div>' +
      '<div class="sig-stars">' + '★'.repeat(r.score) + '<span style="opacity:.2">' + '★'.repeat(4-r.score) + '</span></div>' +
      '<div class="sig-tags">' + tags + '</div>' +
      '<div class="sig-price">' + r.price.toFixed(4) + '</div>' +
      '<div class="sig-trade"><button class="btn btn-primary btn-sm" onclick="tradeSignal(' + safeR + ')">交易</button></div>' +
      '</div>';
  }).join('');
}
async function tradeSignal(signal) {
  const s    = getScanSettings();
  const side = signal.direction === 'LONG' ? 'BUY' : 'SELL';
  const cn   = side === 'BUY' ? '做多' : '做空';
  if (!confirm('确认交易？\n交易对: ' + signal.symbol + '\n方向: ' + cn + '\n评分: ' + signal.score + '分\n金额: ' + s.trade_usdt + ' U  杠杆: ' + s.leverage + 'x\n止损: ' + s.sl_pct + '%  止盈: ' + s.tp_pct + '%')) return;
  const pr  = await fetch('/api/price/' + signal.symbol).then(r => r.json()).catch(() => ({}));
  const qty = Math.round(s.trade_usdt / (pr.price || signal.price) * 1000) / 1000;
  const r   = await fetch('/api/order/sltp', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ symbol: signal.symbol, side, qty, leverage: s.leverage, sl_pct: s.sl_pct, tp_pct: s.tp_pct })
  }).then(r => r.json());
  if (r.ok) { toast('下单成功 ' + cn + ' ' + signal.symbol, 'ok'); autoRefresh(); }
  else toast('下单失败: ' + r.msg, 'err');
}

// ── 图表 ──
function initChart() {
  radarChart = echarts.init(document.getElementById('radar-chart'), null, { renderer: 'canvas' });
  window.addEventListener('resize', () => radarChart.resize());
  radarChart.on('click', params => {
    if (params.data?.value) {
      document.getElementById('f-sym').value = params.data.value[3];
      toast('已选择: ' + params.data.value[3], 'ok');
    }
  });
}
async function loadTickers() {
  const r = await fetch('/api/tickers').then(r => r.json()).catch(() => ({ tickers: [] }));
  if (r.tickers?.length) {
    tickerData = r.tickers; renderChart();
    document.getElementById('radar-ts').textContent = new Date().toLocaleTimeString();
  }
}
function renderChart() {
  if (!radarChart || !tickerData.length) return;
  const maxVol = Math.max(...tickerData.map(t => t.vol));
  const data = tickerData.map(t => {
    const score = signalMap[t.symbol] || 0;
    const size  = Math.max(6, Math.min(40, t.vol / maxVol * 40));
    let color, shadow = 'transparent';
    if      (score >= 4) { color = '#ff3a3a'; shadow = 'rgba(255,58,58,.8)'; }
    else if (score >= 3) { color = '#ffb830'; shadow = 'rgba(255,184,48,.8)'; }
    else if (score >= 2) { color = '#ffd060'; shadow = 'rgba(255,208,96,.7)'; }
    else color = t.chg > 0
      ? 'rgba(82,232,122,' + (0.35 + Math.min(Math.abs(t.chg)/18, .6)) + ')'
      : 'rgba(255,58,58,'  + (0.25 + Math.min(Math.abs(t.chg)/18, .6)) + ')';
    return {
      value: [t.chg, t.vol, size, t.symbol, score],
      itemStyle: {
        color,
        borderColor: score >= 2 ? 'rgba(255,255,255,.5)' : 'transparent',
        borderWidth: score >= 2 ? 1 : 0,
        shadowBlur:  score >= 2 ? 14 : 0,
        shadowColor: shadow,
      },
      symbol:     score >= 2 ? 'diamond' : 'circle',
      symbolSize: score >= 2 ? size * 1.4 : size,
    };
  });
  const labels = tickerData.slice(0, 28).map(t => ({
    coord: [t.chg, t.vol],
    value: (signalMap[t.symbol] >= 2 ? '◆ ' : '') + t.symbol.replace('USDT',''),
    label: {
      show: true, position: 'right', fontSize: 9,
      color:      signalMap[t.symbol] >= 2 ? '#ffb830' : 'rgba(122,96,64,.8)',
      fontWeight: signalMap[t.symbol] >= 2 ? 'bold' : 'normal',
      fontFamily: 'Consolas,monospace',
    }
  }));
  radarChart.setOption({
    backgroundColor: '#0d0a06',
    animation: true, animationDuration: 500, animationEasing: 'cubicOut',
    grid: { left: 50, right: 18, top: 22, bottom: 34 },
    xAxis: {
      type: 'value', name: '24H涨跌%',
      nameTextStyle: { color: 'rgba(122,96,64,.7)', fontSize: 9, fontFamily: 'Consolas,monospace' },
      axisLine:  { lineStyle: { color: 'rgba(255,160,30,.12)' } },
      splitLine: { lineStyle: { color: 'rgba(255,160,30,.07)', type: 'dashed' } },
      axisLabel: { color: 'rgba(122,96,64,.7)', fontSize: 9, fontFamily: 'Consolas,monospace' },
    },
    yAxis: {
      type: 'value', name: '成交额(亿)',
      nameTextStyle: { color: 'rgba(122,96,64,.7)', fontSize: 9, fontFamily: 'Consolas,monospace' },
      axisLine:  { lineStyle: { color: 'rgba(255,160,30,.12)' } },
      splitLine: { lineStyle: { color: 'rgba(255,160,30,.07)', type: 'dashed' } },
      axisLabel: { color: 'rgba(122,96,64,.7)', fontSize: 9, fontFamily: 'Consolas,monospace' },
    },
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(19,16,10,.96)', borderColor: 'rgba(255,160,30,.3)',
      textStyle: { color: '#f5e6c8', fontSize: 11, fontFamily: 'Consolas,monospace' },
      formatter: p => {
        const [chg, vol, , sym, score] = p.data.value;
        const sc = score > 0 ? '<br><span style="color:#ffb830">信号: ' + '★'.repeat(score) + '</span>' : '';
        return '<b style="color:#ffb830">' + sym + '</b><br>涨跌: ' + (chg>0?'+':'') + chg.toFixed(2) + '%<br>成交额: ' + vol.toFixed(1) + '亿' + sc;
      }
    },
    series: [{ type: 'scatter', data, markPoint: { data: labels, symbol: 'none', animation: false } }],
  }, true);
}

// ── 日志 ──
async function loadLog() {
  const r = await fetch('/api/log').then(r => r.json()).catch(() => ({ log: [] }));
  const box = document.getElementById('log-box');
  if (!r.log?.length) return;
  box.innerHTML = r.log.map(l =>
    '<div class="log-entry"><span class="ts">[' + l.ts + ']</span><span class="' + l.level + '">' + l.msg + '</span></div>'
  ).join('');
  box.scrollTop = box.scrollHeight;
}
function clearLog() { document.getElementById('log-box').innerHTML = ''; }

let toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent   = msg;
  el.style.display = 'block';
  el.style.color   = type === 'ok' ? 'var(--green)' : type === 'err' ? 'var(--red)' : 'var(--gold)';
  el.style.borderColor = type === 'ok' ? 'rgba(82,232,122,.3)' : type === 'err' ? 'rgba(255,58,58,.3)' : 'var(--border)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = 'none', 3500);
}

// ── 拖拽分隔 ──
function initResizers() {
  colResize('resizer-left',  '.panel-left',  false);
  colResize('resizer-right', '.panel-right', true);
  colResize('resizer-inner', '.radar-card',  false);
  rowResize('resizer-mid',   '.main-top');
}
function colResize(id, sel, shrink) {
  const resizer = document.getElementById(id);
  const el      = document.querySelector(sel);
  if (!resizer || !el) return;
  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    const startX = e.clientX, startW = el.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cssText = 'cursor:col-resize;user-select:none';
    const move = e => {
      const w = Math.max(180, startW + (shrink ? -(e.clientX-startX) : (e.clientX-startX)));
      el.style.width = w + 'px'; el.style.minWidth = '0';
      if (radarChart) radarChart.resize();
    };
    const up = () => {
      resizer.classList.remove('dragging');
      document.body.style.cssText = '';
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      if (radarChart) radarChart.resize();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}
function rowResize(id, sel) {
  const resizer = document.getElementById(id);
  const el      = document.querySelector(sel);
  if (!resizer || !el) return;
  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    const startY = e.clientY, startH = el.offsetHeight;
    resizer.classList.add('dragging');
    document.body.style.cssText = 'cursor:row-resize;user-select:none';
    const move = e => {
      const h = Math.max(200, startH + e.clientY - startY);
      el.style.flex = 'none'; el.style.height = h + 'px';
      if (radarChart) radarChart.resize();
    };
    const up = () => {
      resizer.classList.remove('dragging');
      document.body.style.cssText = '';
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}
