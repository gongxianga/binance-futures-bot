<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>币安合约交易系统 v4.0</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root {
  --bg:      #f0f2f5;
  --bg2:     #ffffff;
  --bg3:     #f7f8fa;
  --bg4:     #eef0f4;
  --panel:   #ffffff;
  --border:  #dde1ea;
  --border2: #e8ebf0;
  --text:    #1a1d2b;
  --muted:   #8892a4;
  --blue:    #2563eb;
  --blue2:   #1d4ed8;
  --green:   #16a34a;
  --red:     #dc2626;
  --yellow:  #d97706;
  --purple:  #7c3aed;
  --shadow:  0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  --shadow2: 0 2px 8px rgba(0,0,0,.10);
  --font-mono: 'Consolas','SF Mono','Courier New',monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cdd2dc; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #b0b8c8; }

/* ── 顶栏 ── */
.hdr {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 18px;
  display: flex; align-items: center; gap: 12px;
  height: 54px; flex-shrink: 0;
  box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(0,0,0,.04);
}
.logo-box { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 34px; height: 34px; flex-shrink: 0;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #fff;
  box-shadow: 0 2px 8px rgba(37,99,235,.3);
}
.logo-title { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: .3px; }
.logo-sub   { font-size: 11px; color: var(--muted); }
.hdr-sep    { width: 1px; height: 26px; background: var(--border); flex-shrink: 0; }
.hdr-right  { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.inp {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; padding: 6px 11px; color: var(--text);
  font-size: 12px; outline: none; transition: all .18s;
}
.inp:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.inp::placeholder { color: var(--muted); }

.chk { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.chk:hover { color: var(--text); }

.status-badge {
  font-size: 11px; font-weight: 600; padding: 4px 11px;
  border-radius: 20px; letter-spacing: .3px;
}
.status-badge.ok  { color: var(--green); background: #dcfce7; }
.status-badge.err { color: var(--red);   background: #fee2e2; }

.user-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 12px;
  font-size: 12px; color: var(--text); font-weight: 500;
}
.user-dot {
  width: 6px; height: 6px; background: var(--green);
  border-radius: 50%;
}

/* ── 主体 ── */
.body {
  display: flex; flex-direction: row;
  padding: 8px; gap: 0;
  flex: 1; overflow: hidden; min-height: 0;
}

.panel-left  { width: 290px; min-width: 220px; display: flex; flex-direction: column; flex-shrink: 0; gap: 7px; }
.panel-main  { flex: 1; min-width: 380px; display: flex; flex-direction: column; overflow: hidden; }
.panel-right { width: 252px; min-width: 180px; flex-shrink: 0; display: flex; flex-direction: column; }

/* 分隔条 */
.resizer-col {
  width: 10px; cursor: col-resize; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.resizer-col::after {
  content: ''; width: 3px; height: 44px;
  background: var(--border2); border-radius: 2px; transition: all .18s;
}
.resizer-col:hover::after, .resizer-col.dragging::after { background: var(--blue); height: 60px; }
.resizer-row {
  height: 10px; cursor: row-resize; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.resizer-row::after {
  content: ''; height: 3px; width: 44px;
  background: var(--border2); border-radius: 2px; transition: all .18s;
}
.resizer-row:hover::after, .resizer-row.dragging::after { background: var(--blue); width: 60px; }

/* ── 卡片 ── */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.card-hdr {
  padding: 9px 14px;
  font-size: 12px; font-weight: 600; color: var(--text);
  border-bottom: 1px solid var(--border2);
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3);
}
.hdr-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--blue); flex-shrink: 0;
}
.hdr-dot.green  { background: var(--green); }
.hdr-dot.yellow { background: var(--yellow); }
.hdr-dot.red    { background: var(--red); }
.card-hdr-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }

/* ── 账户 ── */
.acc-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 12px; }
.acc-chip {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; padding: 10px 10px 8px;
}
.acc-chip label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 5px; }
.acc-chip .val { font-size: 14px; font-weight: 700; color: var(--green); font-family: var(--font-mono); }
.acc-chip .val.neg     { color: var(--red); }
.acc-chip .val.neutral { color: var(--blue); }

/* ── 表单 ── */
.form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.form-row label { font-size: 11px; color: var(--muted); width: 60px; text-align: right; flex-shrink: 0; }
.form-inp {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 7px; padding: 7px 10px; color: var(--text);
  font-size: 12px; outline: none; transition: all .18s;
}
.form-inp:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
.form-inp::placeholder { color: var(--muted); }
select.form-inp { cursor: pointer; }
.sym-row { flex: 1; display: flex; gap: 6px; align-items: center; }
.cur-price {
  font-family: var(--font-mono); font-size: 20px; font-weight: 700;
  color: var(--yellow); text-align: center; margin: -2px 0 10px;
}

/* ── 按钮 ── */
.btn {
  border: 1px solid transparent; border-radius: 7px; padding: 7px 14px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.btn:hover { filter: brightness(.94); }
.btn:active { filter: brightness(.88); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-long    { background: #dcfce7; color: var(--green); border-color: #bbf7d0; }
.btn-long:hover  { background: #bbf7d0; }
.btn-short   { background: #fee2e2; color: var(--red);   border-color: #fecaca; }
.btn-short:hover { background: #fecaca; }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 1px 4px rgba(37,99,235,.25); }
.btn-primary:hover { background: var(--blue2); }
.btn-ghost   { background: var(--bg3); color: var(--muted); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg4); color: var(--text); }
.btn-warn    { background: #fef9c3; color: var(--yellow); border-color: #fde68a; }
.btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
.sep { border: none; border-top: 1px solid var(--border2); margin: 10px 0; }

/* ── 主区：雷达 + 扫描 ── */
.main-top { flex: 1; display: flex; flex-direction: row; gap: 0; overflow: hidden; min-height: 0; }
.radar-card   { width: 44%; min-width: 260px; flex-shrink: 0; display: flex; flex-direction: column; }
.scanner-card { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* 雷达 */
.radar-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#radar-chart { width: 100%; height: 100%; }
.radar-ring {
  position: absolute; border-radius: 50%; border: 1px solid rgba(37,99,235,.15);
  pointer-events: none; top: 50%; left: 50%;
}
.radar-ring:nth-child(1) { width: 80px;  height: 80px;  margin:-40px  0 0 -40px;  animation: rpulse 3.5s ease-out infinite; }
.radar-ring:nth-child(2) { width: 160px; height: 160px; margin:-80px  0 0 -80px;  animation: rpulse 3.5s ease-out infinite .9s; border-color: rgba(37,99,235,.08); }
.radar-ring:nth-child(3) { width: 260px; height: 260px; margin:-130px 0 0 -130px; animation: rpulse 3.5s ease-out infinite 1.8s; border-color: rgba(37,99,235,.04); }
@keyframes rpulse { 0%{opacity:.8;transform:scale(.85)} 100%{opacity:0;transform:scale(1.35)} }
.scan-sweep {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(37,99,235,.04) 20deg, rgba(37,99,235,.09) 40deg, transparent 60deg);
  animation: sweep 4s linear infinite; display: none; pointer-events: none;
}
.scan-sweep.active { display: block; }
@keyframes sweep { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

/* 扫描设置 */
.scan-settings-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-bottom: 9px; }
.scan-field label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
.scan-ctrl { display: flex; gap: 8px; align-items: center; }
.countdown { font-size: 11px; color: var(--muted); }
.progress-wrap { flex: 1; }
.progress-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.progress-bar-bg { background: var(--bg4); border: 1px solid var(--border2); border-radius: 3px; height: 5px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--blue), var(--purple)); border-radius: 3px; width: 0%; transition: width .3s; }

/* 信号卡片 */
.signal-grid { display: flex; flex-direction: column; gap: 5px; }
.signal-card {
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; padding: 9px 12px;
  display: flex; align-items: center; gap: 9px;
  transition: all .15s; position: relative; overflow: hidden;
}
.signal-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; bottom: 0; border-radius: 8px 0 0 8px; }
.signal-card.long  { }
.signal-card.long::before  { background: var(--green); }
.signal-card.short::before { background: var(--red); }
.signal-card:hover { background: var(--bg4); border-color: var(--border); box-shadow: var(--shadow2); }
.sig-sym { font-size: 13px; font-weight: 700; color: var(--text); min-width: 76px; }
.sig-dir { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 5px; }
.sig-dir.long  { background: #dcfce7; color: var(--green); }
.sig-dir.short { background: #fee2e2; color: var(--red); }
.sig-stars { color: var(--yellow); font-size: 13px; letter-spacing: -1px; }
.sig-price { font-size: 11px; color: var(--muted); margin-left: auto; font-family: var(--font-mono); }
.sig-tags  { display: flex; gap: 4px; flex-wrap: wrap; }
.sig-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: var(--bg4); color: var(--muted); border: 1px solid var(--border2); }
.sig-tag.up { background: #dcfce7; color: var(--green); border-color: #bbf7d0; }
.sig-tag.dn { background: #fee2e2; color: var(--red);   border-color: #fecaca; }
.sig-trade { flex-shrink: 0; }
.empty-state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 12px; }
/* 历史信号对比 */
.prev-section { margin-top: 14px; }
.prev-hdr { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; padding: 6px 0 8px; border-top: 1px solid var(--border2); display: flex; align-items: center; gap: 8px; }
.prev-hdr span { font-size: 10px; font-weight: 400; color: var(--muted); }
.prev-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.prev-table th { color: var(--muted); font-weight: 600; font-size: 9px; letter-spacing: .8px; text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border2); }
.prev-table td { padding: 5px 6px; border-bottom: 1px solid var(--border2); color: var(--text); font-family: var(--font-mono); vertical-align: middle; }
.prev-table tr:last-child td { border-bottom: none; }
.prev-table tr:hover td { background: var(--bg3); }
.pnl-up   { color: var(--green); font-weight: 700; }
.pnl-dn   { color: var(--red);   font-weight: 700; }
.pnl-flat { color: var(--muted); }
.empty-icon  { font-size: 28px; margin-bottom: 8px; opacity: .5; display: block; }

/* 持仓 */
.positions-card { flex-shrink: 0; height: 165px; min-height: 80px; overflow: hidden; }
.pos-expand-btn {
  background: transparent; border: none; cursor: pointer;
  color: var(--muted); font-size: 14px; padding: 0 4px;
  transition: all .15s; line-height: 1;
}
.pos-expand-btn:hover { color: var(--blue); }
.pos-expand-btn.expanded { transform: rotate(90deg); color: var(--blue); }
.pos-detail-row { display: none; }
.pos-detail-row.show { display: table-row; }
.pos-detail-cell {
  padding: 0 !important; border-bottom: 1px solid var(--border2) !important;
  background: var(--bg3); animation: slideDown .2s ease;
}
@keyframes slideDown { from{opacity:0} to{opacity:1} }
.pos-detail-content {
  padding: 12px 16px; display: grid;
  grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.pos-detail-item {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 6px; padding: 8px 10px;
}
.pos-detail-item label {
  display: block; font-size: 9px; color: var(--muted);
  margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px;
}
.pos-detail-item .value {
  font-size: 12px; font-weight: 600; color: var(--text);
  font-family: var(--font-mono);
}

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th {
  background: var(--bg3); padding: 7px 8px;
  text-align: center; font-weight: 600; color: var(--muted);
  white-space: nowrap; border-bottom: 1px solid var(--border2);
  font-size: 10px;
}
th[onclick]:hover { background: var(--bg4); color: var(--text); }
td { padding: 7px 8px; text-align: center; border-bottom: 1px solid var(--border2); white-space: nowrap; color: var(--text); }
tr:hover td { background: var(--bg3); }
.green  { color: var(--green) !important; font-weight: 600; }
.red    { color: var(--red)   !important; font-weight: 600; }
.yellow { color: var(--yellow); }
.muted  { color: var(--muted); }
.accent { color: var(--blue); font-weight: 600; }

/* 日志 */
.log-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.log-box {
  font-family: var(--font-mono); font-size: 11px;
  overflow-y: auto; padding: 10px 12px; flex: 1; line-height: 1.7;
  color: var(--text);
}
.log-entry { margin-bottom: 0; }
.ts { color: var(--muted); margin-right: 6px; font-size: 10px; }
.log-box .ok   { color: var(--green); }
.log-box .err  { color: var(--red); font-weight: 600; }
.log-box .warn { color: var(--yellow); }
.log-box .info { color: var(--muted); }

/* Toast */
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 16px; font-size: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
  display: none; z-index: 999; max-width: 320px;
  animation: slideUp .2s ease;
}
@keyframes slideUp { from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1} }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="hdr">
  <div class="logo-box">
    <div class="logo-icon">&#9889;</div>
    <div>
      <div class="logo-title">币安合约交易系统</div>
      <div class="logo-sub">v4.0 &nbsp;·&nbsp; Futures Bot</div>
    </div>
  </div>

  <div class="hdr-sep"></div>

  <input class="inp" id="inp-key"    type="password" placeholder="API Key"    style="width:144px">
  <input class="inp" id="inp-secret" type="password" placeholder="API Secret" style="width:144px">
  <label class="chk"><input type="checkbox" id="chk-testnet" checked> 测试网</label>
  <button class="btn btn-primary btn-sm" id="btn-connect" onclick="connect()">连 接</button>
  <span class="status-badge err" id="conn-status">● 未连接</span>

  <div class="hdr-sep"></div>

  <div class="hdr-right">
    <div class="user-chip">
      <div class="user-dot"></div>
      <span id="current-user">加载中...</span>
    </div>
    <a href="https://github.com/gongxianga/binance-futures-bot" target="_blank" style="text-decoration:none">
      <button class="btn btn-ghost btn-sm">
        <svg style="width:11px;height:11px;vertical-align:middle;margin-right:3px" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </button>
    </a>
    <button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>
  </div>
</div>

<!-- 主体 -->
<div class="body">

  <!-- 左栏 -->
  <div class="panel-left">

    <div class="card">
      <div class="card-hdr">
        <div class="hdr-dot green"></div> 账户状态
        <div class="card-hdr-r">
          <button class="btn btn-ghost btn-sm" onclick="loadAccount()">刷新</button>
        </div>
      </div>
      <div class="acc-grid">
        <div class="acc-chip"><label>可用余额</label><div class="val" id="v-avail">--</div></div>
        <div class="acc-chip"><label>钱包余额</label><div class="val neutral" id="v-wallet">--</div></div>
        <div class="acc-chip"><label>未实现盈亏</label><div class="val" id="v-pnl">--</div></div>
      </div>
    </div>

    <div class="card" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="card-hdr">
        <div class="hdr-dot"></div> 手动下单
      </div>
      <div style="flex:1;overflow-y:auto;padding:12px">
        <div class="form-row">
          <label>交易对</label>
          <div class="sym-row">
            <input class="form-inp" id="f-sym" value="BTCUSDT">
            <button class="btn btn-ghost btn-sm" onclick="getPrice()">报价</button>
          </div>
        </div>
        <div class="cur-price" id="f-cprice">--</div>
        <div class="form-row">
          <label>订单类型</label>
          <select class="form-inp" id="f-otype" onchange="onOtypeChange()">
            <option>MARKET</option><option>LIMIT</option>
          </select>
        </div>
        <div class="form-row">
          <label>杠杆倍数</label>
          <input class="form-inp" id="f-lev" value="10" type="number" min="1" max="125">
        </div>
        <div class="form-row">
          <label>数量</label>
          <input class="form-inp" id="f-qty" value="0.001">
        </div>
        <div class="form-row">
          <label>限价</label>
          <input class="form-inp" id="f-lprice" disabled placeholder="仅限价单填写">
        </div>
        <div class="btn-row" style="margin-bottom:9px">
          <button class="btn btn-long"  onclick="manualOrder('BUY')">&#9650; 做 多</button>
          <button class="btn btn-short" onclick="manualOrder('SELL')">&#9660; 做 空</button>
        </div>
        <button class="btn btn-warn btn-sm" style="width:100%" onclick="cancelOrders()">撤销当前交易对挂单</button>
      </div>
    </div>

  </div>

  <div class="resizer-col" id="resizer-left"></div>

  <!-- 中栏 -->
  <div class="panel-main">

    <div class="main-top">

      <!-- 市场雷达 -->
      <div class="card radar-card">
        <div class="card-hdr">
          <div class="hdr-dot"></div> 市场雷达
          <span style="font-size:10px;color:var(--muted);font-weight:400" id="radar-ts"></span>
          <div class="card-hdr-r">
            <button class="btn btn-ghost btn-sm" onclick="loadTickers()">刷新</button>
          </div>
        </div>
        <div class="radar-wrap">
          <div id="radar-chart"></div>
          <div class="radar-ring"></div>
          <div class="radar-ring"></div>
          <div class="radar-ring"></div>
          <div class="scan-sweep" id="scan-sweep"></div>
        </div>
      </div>

      <div class="resizer-col" id="resizer-inner"></div>

      <!-- 策略扫描 -->
      <div class="card scanner-card">
        <div class="card-hdr">
          <div class="hdr-dot" id="scan-dot" style="background:var(--muted)"></div>
          策略扫描
          <span style="font-size:10px;color:var(--muted);font-weight:400" id="scan-ts"></span>
          <div class="card-hdr-r">
            <span class="countdown" id="scan-status">未启动</span>
          </div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
          <div style="padding:10px 12px 8px;border-bottom:1px solid var(--border2);background:var(--bg3)">
            <div class="scan-settings-grid">
              <div class="scan-field">
                <label>最低信号分</label>
                <input class="form-inp" id="s-minscore" value="2" type="number" min="1" max="4">
              </div>
              <div class="scan-field">
                <label>每笔金额 (USDT)</label>
                <input class="form-inp" id="s-usdt" value="100">
              </div>
              <div class="scan-field">
                <label>杠杆倍数</label>
                <input class="form-inp" id="s-lev" value="10" type="number">
              </div>
              <div class="scan-field">
                <label>止损 %</label>
                <input class="form-inp" id="s-sl" value="2.0">
              </div>
              <div class="scan-field">
                <label>止盈 %</label>
                <input class="form-inp" id="s-tp" value="4.0">
              </div>
              <div class="scan-field" style="display:flex;flex-direction:column;justify-content:flex-end">
                <label>执行模式</label>
                <select class="form-inp" id="s-mode">
                  <option value="manual">手动确认</option>
                  <option value="auto">全自动</option>
                </select>
              </div>
            </div>
            <div class="scan-ctrl">
              <button class="btn btn-primary btn-sm" id="btn-scan-start" onclick="startScan()">&#9654; 开始扫描</button>
              <button class="btn btn-ghost btn-sm"   id="btn-scan-stop"  onclick="stopScan()" disabled>&#9632; 停止</button>
              <div class="progress-wrap" id="scan-progress-wrap" style="display:none">
                <div class="progress-meta">
                  <span id="scan-progress-text">扫描中...</span>
                  <span id="scan-progress-pct">0%</span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-bar" id="scan-progress-bar"></div>
                </div>
              </div>
            </div>
          </div>
          <div style="flex:1;overflow-y:auto;padding:10px 12px">
            <div class="empty-state" id="scan-empty">
              <span class="empty-icon">&#128225;</span>
              点击「开始扫描」启动策略雷达
            </div>
            <div class="signal-grid" id="scan-signals"></div>
            <div class="prev-section" id="prev-section" style="display:none">
              <div class="prev-hdr">上次信号表现 <span id="prev-ts-label"></span></div>
              <table class="prev-table">
                <thead><tr>
                  <th>币种</th><th>方向</th><th>信号价</th><th>当前价</th><th>价格变化</th><th>预期盈亏</th><th>评分</th>
                </tr></thead>
                <tbody id="prev-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="resizer-row" id="resizer-mid"></div>

    <!-- 持仓 -->
    <div class="card positions-card">
      <div class="card-hdr">
        <div class="hdr-dot green"></div> 当前持仓
        <div class="card-hdr-r">
          <button class="btn btn-warn btn-sm" onclick="batchClosePositions()" id="btn-batch-close" style="display:none;margin-right:6px">平仓选中</button>
          <button class="btn btn-ghost btn-sm" onclick="loadPositions()">刷新</button>
        </div>
      </div>
      <div class="tbl-wrap" style="overflow-y:auto;height:calc(100% - 38px)">
        <table>
          <thead><tr>
            <th style="width:20px"><input type="checkbox" id="pos-check-all" onchange="toggleAllPositions(this.checked)"></th>
            <th style="width:20px"></th>
            <th>交易对</th><th>方向</th>
            <th style="cursor:pointer" onclick="sortPositions('amt')" title="点击排序">数量 ⇅</th>
            <th style="cursor:pointer" onclick="sortPositions('entry')" title="点击排序">开仓价 ⇅</th>
            <th>标记价</th>
            <th style="cursor:pointer" onclick="sortPositions('pnl')" title="点击排序">未实现盈亏 ⇅</th>
            <th style="cursor:pointer" onclick="sortPositions('roe')" title="点击排序">收益率% ⇅</th>
            <th>杠杆</th><th>操作</th>
          </tr></thead>
          <tbody id="pos-tbody">
            <tr><td colspan="11" class="muted" style="padding:18px">暂无持仓</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <div class="resizer-col" id="resizer-right"></div>

  <!-- 右栏：日志 -->
  <div class="panel-right">
    <div class="card log-panel">
      <div class="card-hdr">
        <div class="hdr-dot yellow"></div> 操作日志
        <div class="card-hdr-r">
          <button class="btn btn-ghost btn-sm" onclick="loadLog()">刷新</button>
          <button class="btn btn-ghost btn-sm" onclick="clearLog()">清空</button>
        </div>
      </div>
      <div class="log-box" id="log-box">
        <div class="log-entry"><span class="ts">[--:--:--]</span><span class="info">系统初始化中...</span></div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
let radarChart  = null;
let tickerData  = [];
let signalMap   = {};
let scanRunning = false;
let posSort     = { by: 'pnl', order: 'desc' };
let expandedPos = new Set(); // 记录展开的持仓

window.addEventListener('load', () => {
  loadCurrentUser(); initChart(); loadTickers(); loadStatus();
  loadLog(); loadSavedConfig();
  setInterval(autoRefresh,    5000);
  // setInterval(loadLog,        3000);  // 已关闭日志自动刷新
  setInterval(loadScanStatus, 1000);
  setInterval(loadTickers,   60000);
  initResizers();
});

async function loadCurrentUser() {
  const r = await fetch('/api/auth/status').then(r=>r.json()).catch(()=>({}));
  if (r.authenticated) document.getElementById('current-user').textContent = r.username;
  else window.location.href = '/login';
}
async function logout() {
  if (!confirm('确认退出登录？')) return;
  await fetch('/api/auth/logout', {method:'POST'});
  window.location.href = '/login';
}
async function loadStatus() {
  const r = await fetch('/api/status').then(r=>r.json()).catch(()=>({}));
  if (r.connected) { setConnected(true); autoRefresh(); }
}
async function loadSavedConfig() {
  const cfg = await fetch('/api/config').then(r=>r.json()).catch(()=>({}));
  if (cfg.api_key) document.getElementById('inp-key').value = cfg.api_key;
  if (cfg.testnet !== undefined) document.getElementById('chk-testnet').checked = cfg.testnet;
}
async function connect() {
  const key = document.getElementById('inp-key').value.trim();
  const secret = document.getElementById('inp-secret').value.trim();
  const test = document.getElementById('chk-testnet').checked;
  if (!key || !secret) { toast('请填写 API Key 和 Secret', 'err'); return; }
  const btn = document.getElementById('btn-connect');
  btn.disabled = true; btn.textContent = '连接中...';
  const r = await fetch('/api/connect', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({api_key:key, api_secret:secret, testnet:test})
  }).then(r=>r.json());
  btn.disabled = false; btn.textContent = '连 接';
  if (r.ok) { setConnected(true); toast('连接成功', 'ok'); autoRefresh(); }
  else { setConnected(false); toast('连接失败: '+r.msg, 'err'); }
}
function setConnected(ok) {
  const el = document.getElementById('conn-status');
  el.className   = 'status-badge '+(ok?'ok':'err');
  el.textContent = ok ? '● 已连接' : '● 未连接';
}
async function autoRefresh() { await loadAccount(); await loadPositions(); }
async function loadAccount() {
  const r = await fetch('/api/account').then(r=>r.json()).catch(()=>({}));
  if (!r.ok) return;
  document.getElementById('v-avail').textContent  = r.available.toFixed(2)+' U';
  document.getElementById('v-wallet').textContent = r.wallet.toFixed(2)+' U';
  const el = document.getElementById('v-pnl');
  el.textContent = (r.pnl>=0?'+':'')+r.pnl.toFixed(2)+' U';
  el.className = 'val '+(r.pnl>=0?'':'neg');
}
async function loadPositions() {
  // 保存当前勾选状态
  const checkedSymbols = new Set();
  document.querySelectorAll('.pos-checkbox:checked').forEach(cb => {
    checkedSymbols.add(cb.dataset.symbol);
  });

  const url = `/api/positions?sort=${posSort.by}&order=${posSort.order}`;
  const r = await fetch(url).then(r=>r.json()).catch(()=>({positions:[]}));
  const tbody = document.getElementById('pos-tbody');
  if (!r.positions.length) {
    tbody.innerHTML='<tr><td colspan="11" class="muted" style="padding:16px">暂无持仓</td></tr>';
    document.getElementById('btn-batch-close').style.display = 'none';
    document.getElementById('pos-check-all').checked = false;
    return;
  }

  tbody.innerHTML = r.positions.map((p,i)=>{
    const rowId = 'pos-row-'+i;
    const detailId = 'pos-detail-'+i;
    const updateTime = p.updateTime ? new Date(p.updateTime).toLocaleString('zh-CN') : '--';
    const now = Date.now();
    const holdTime = p.updateTime ? formatDuration(now - p.updateTime) : '--';
    const isExpanded = expandedPos.has(p.symbol);

    const isChecked = checkedSymbols.has(p.symbol);
    return `
    <tr id="${rowId}" class="pos-main-row">
      <td><input type="checkbox" class="pos-checkbox" data-symbol="${p.symbol}" data-amt="${p.positionAmt}" onchange="updateBatchCloseBtn()" ${isChecked?'checked':''}></td>
      <td><button class="pos-expand-btn ${isExpanded?'expanded':''}" onclick="togglePosDetail('${p.symbol}', '${detailId}', this)">▶</button></td>
      <td class="accent">${p.symbol}</td>
      <td class="${p.side==='多'?'green':'red'}">${p.side==='多'?'多 ▲':'空 ▼'}</td>
      <td>${p.amt.toFixed(4)}</td><td>${p.entry.toFixed(4)}</td><td>${p.mark.toFixed(4)}</td>
      <td class="${p.pnl>=0?'green':'red'}">${p.pnl>=0?'+':''}${p.pnl.toFixed(2)}</td>
      <td class="${p.roe>=0?'green':'red'}">${p.roe>=0?'+':''}${p.roe.toFixed(2)}%</td>
      <td style="color:var(--yellow);font-weight:600">${p.leverage}x</td>
      <td><button class="btn btn-short btn-sm" onclick="closePos('${p.symbol}')">平仓</button></td>
    </tr>
    <tr id="${detailId}" class="pos-detail-row ${isExpanded?'show':''}">
      <td colspan="11" class="pos-detail-cell">
        <div class="pos-detail-content">
          <div class="pos-detail-item">
            <label>保证金</label>
            <div class="value">${p.margin>0?p.margin.toFixed(2):'--'} U</div>
          </div>
          <div class="pos-detail-item">
            <label>仓位价值</label>
            <div class="value">${p.notional>0?p.notional.toFixed(2):'--'} U</div>
          </div>
          <div class="pos-detail-item">
            <label>预估强平价</label>
            <div class="value" style="color:var(--red)">${p.liquidation>0?p.liquidation.toFixed(4):'--'}</div>
          </div>
          <div class="pos-detail-item">
            <label>持仓时长</label>
            <div class="value">${holdTime}</div>
          </div>
          <div class="pos-detail-item">
            <label>更新时间</label>
            <div class="value" style="font-size:10px">${updateTime}</div>
          </div>
          <div class="pos-detail-item">
            <label>价格变化</label>
            <div class="value ${p.mark>p.entry?'green':'red'}">
              ${((p.mark-p.entry)/p.entry*100).toFixed(2)}%
            </div>
          </div>
          <div class="pos-detail-item">
            <label>距强平</label>
            <div class="value">
              ${p.liquidation>0?Math.abs((p.liquidation-p.mark)/p.mark*100).toFixed(2)+'%':'--'}
            </div>
          </div>
          <div class="pos-detail-item">
            <label>仓位模式</label>
            <div class="value">单向持仓</div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
  updateSortHeaders();

  // 恢复勾选状态后更新按钮
  updateBatchCloseBtn();
}
function togglePosDetail(symbol, detailId, btn) {
  const row = document.getElementById(detailId);
  const isShow = row.classList.contains('show');
  row.classList.toggle('show');
  btn.classList.toggle('expanded');

  // 更新展开状态
  if (isShow) {
    expandedPos.delete(symbol);
  } else {
    expandedPos.add(symbol);
  }
}
function formatDuration(ms) {
  const sec = Math.floor(ms / 1000);
  const min = Math.floor(sec / 60);
  const hr = Math.floor(min / 60);
  const day = Math.floor(hr / 24);
  if (day > 0) return day + '天' + (hr % 24) + '时';
  if (hr > 0) return hr + '时' + (min % 60) + '分';
  if (min > 0) return min + '分' + (sec % 60) + '秒';
  return sec + '秒';
}
function sortPositions(by) {
  if (posSort.by === by) { posSort.order = posSort.order === 'desc' ? 'asc' : 'desc'; }
  else { posSort.by = by; posSort.order = 'desc'; }
  loadPositions();
}
function updateSortHeaders() {
  const headers = document.querySelectorAll('th[onclick]');
  headers.forEach(h => {
    const field = h.getAttribute('onclick').match(/sortPositions\('(\w+)'\)/)?.[1];
    if (!field) return;
    const label = h.textContent.replace(/ [↑↓⇅]/g, '').trim();
    if (field === posSort.by) {
      h.innerHTML = label + (posSort.order === 'desc' ? ' ↓' : ' ↑');
      h.style.color = 'var(--blue)';
    } else {
      h.innerHTML = label + ' ⇅';
      h.style.color = 'var(--muted)';
    }
  });
}
async function getPrice() {
  const sym = document.getElementById('f-sym').value.trim().toUpperCase();
  const r = await fetch('/api/price/'+sym).then(r=>r.json()).catch(()=>({}));
  if (r.ok) document.getElementById('f-cprice').textContent = r.price.toFixed(4);
  else toast('报价失败: '+(r.msg||'请检查交易对'), 'err');
}
function onOtypeChange() {
  document.getElementById('f-lprice').disabled = document.getElementById('f-otype').value !== 'LIMIT';
}
async function manualOrder(side) {
  const sym   = document.getElementById('f-sym').value.trim().toUpperCase();
  const otype = document.getElementById('f-otype').value;
  const qty   = parseFloat(document.getElementById('f-qty').value);
  const lev   = parseInt(document.getElementById('f-lev').value);
  const lpx   = parseFloat(document.getElementById('f-lprice').value);
  const cn    = side==='BUY'?'做多(买入)':'做空(卖出)';
  const extra = otype==='LIMIT'?'\n限价: '+lpx:'';
  if (!confirm('确认下单？\n交易对: '+sym+'\n方向: '+cn+'\n类型: '+otype+'\n数量: '+qty+'\n杠杆: '+lev+'x'+extra)) return;
  const body = {symbol:sym, side, type:otype, qty, leverage:lev};
  if (otype==='LIMIT') body.price = lpx;
  const r = await fetch('/api/order', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(r=>r.json());
  if (r.ok) { toast('下单成功 '+cn+' '+sym, 'ok'); autoRefresh(); }
  else toast('下单失败: '+r.msg, 'err');
}
async function closePos(symbol) {
  if (!confirm('确认平仓 '+symbol+'？')) return;
  const r = await fetch('/api/close', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol})}).then(r=>r.json());
  if (r.ok) { toast('平仓成功: '+symbol, 'ok'); autoRefresh(); }
  else toast('平仓失败: '+r.msg, 'err');
}

function toggleAllPositions(checked) {
  const checkboxes = document.querySelectorAll('.pos-checkbox');
  checkboxes.forEach(cb => cb.checked = checked);
  updateBatchCloseBtn();
}

function updateBatchCloseBtn() {
  const checkboxes = document.querySelectorAll('.pos-checkbox:checked');
  const btn = document.getElementById('btn-batch-close');
  const checkAll = document.getElementById('pos-check-all');

  if (checkboxes.length > 0) {
    btn.style.display = 'inline-block';
    btn.textContent = `平仓选中 (${checkboxes.length})`;
  } else {
    btn.style.display = 'none';
  }

  // 更新全选框状态
  const allCheckboxes = document.querySelectorAll('.pos-checkbox');
  if (allCheckboxes.length > 0) {
    checkAll.checked = checkboxes.length === allCheckboxes.length;
  }
}

async function batchClosePositions() {
  const checkboxes = document.querySelectorAll('.pos-checkbox:checked');
  if (checkboxes.length === 0) {
    toast('请先选择要平仓的持仓', 'warn');
    return;
  }

  const positions = Array.from(checkboxes).map(cb => ({
    symbol: cb.dataset.symbol,
    amt: cb.dataset.amt
  }));

  const symbols = positions.map(p => p.symbol).join(', ');
  if (!confirm(`确认平仓以下 ${positions.length} 个持仓？\n${symbols}`)) return;

  // 显示处理中状态
  const btn = document.getElementById('btn-batch-close');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '平仓中...';

  const r = await fetch('/api/batch_close', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({positions})
  }).then(r => r.json()).catch(e => ({ok: false, msg: '请求失败'}));

  btn.disabled = false;
  btn.textContent = originalText;

  if (r.ok) {
    const success = r.results.filter(x => x.ok).length;
    const failed = r.results.filter(x => !x.ok).length;
    let msg = `批量平仓完成：成功 ${success} 个`;
    if (failed > 0) msg += `，失败 ${failed} 个`;
    toast(msg, failed > 0 ? 'warn' : 'ok');

    // 显示失败详情
    r.results.filter(x => !x.ok).forEach(x => {
      toast(`${x.symbol} 失败: ${x.msg}`, 'err');
    });

    autoRefresh();
  } else {
    toast('批量平仓失败: ' + r.msg, 'err');
  }
}

async function cancelOrders() {
  const sym = document.getElementById('f-sym').value.trim().toUpperCase();
  if (!confirm('撤销 '+sym+' 所有挂单？')) return;
  const r = await fetch('/api/cancel', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol:sym})}).then(r=>r.json());
  toast(r.msg, r.ok?'ok':'err');
}
function getScanSettings() {
  return {
    min_score:  parseInt(document.getElementById('s-minscore').value),
    trade_usdt: parseFloat(document.getElementById('s-usdt').value),
    leverage:   parseInt(document.getElementById('s-lev').value),
    sl_pct:     parseFloat(document.getElementById('s-sl').value),
    tp_pct:     parseFloat(document.getElementById('s-tp').value),
    auto_trade: document.getElementById('s-mode').value==='auto',
  };
}
function setScanActive(active) {
  document.getElementById('btn-scan-start').disabled = active;
  document.getElementById('btn-scan-stop').disabled  = !active;
  document.getElementById('scan-sweep').classList.toggle('active', active);
  const dot = document.getElementById('scan-dot');
  dot.style.background = active ? 'var(--blue)' : 'var(--muted)';
}
async function startScan() {
  const r = await fetch('/api/scan/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(getScanSettings())}).then(r=>r.json());
  if (r.ok) { scanRunning=true; setScanActive(true); toast('扫描已启动', 'ok'); }
}
async function stopScan() {
  await fetch('/api/scan/stop', {method:'POST'});
  scanRunning=false; setScanActive(false);
  document.getElementById('scan-status').textContent = '未启动';
}
async function loadScanStatus() {
  const r = await fetch('/api/scan/status').then(r=>r.json()).catch(()=>({}));
  if (!r) return;
  scanRunning = r.running;
  setScanActive(r.running);
  const prog = r.progress||{};
  const wrap = document.getElementById('scan-progress-wrap');
  if (prog.total>0) {
    const pct = Math.round(prog.current/prog.total*100);
    wrap.style.display='block';
    document.getElementById('scan-progress-text').textContent = prog.current+'/'+prog.total+' '+prog.symbol;
    document.getElementById('scan-progress-pct').textContent  = pct+'%';
    document.getElementById('scan-progress-bar').style.width  = pct+'%';
    document.getElementById('scan-status').textContent = '实时扫描中...';
  } else {
    wrap.style.display='none';
    if (r.running) document.getElementById('scan-status').textContent = '实时扫描中...';
  }
  if (r.ts) {
    document.getElementById('scan-ts').textContent = r.ts;
    renderSignals(r.results||[]);
    signalMap={};
    (r.results||[]).forEach(s=>{signalMap[s.symbol]=s.score;});
    if (tickerData.length) renderChart();
  }
  if (r.prev_ts) {
    renderPrevSignals(r.prev_results||[], r.prev_ts, r.ts);
  }
}
function renderSignals(results) {
  const empty=document.getElementById('scan-empty');
  const grid =document.getElementById('scan-signals');
  if (!results.length) { empty.style.display='block'; grid.innerHTML=''; return; }
  empty.style.display='none';
  grid.innerHTML = results.map(r=>{
    const isLong=r.direction==='LONG';
    const d=r.details;
    const tc=c=>c==='green'?'up':c==='red'?'dn':'';
    const tags=[
      '<span class="sig-tag '+tc(d.vol.cls)+'">量价 '+(d.vol.text||'')+'</span>',
      '<span class="sig-tag '+tc(d.rsi.cls)+'">RSI '+(d.rsi.text||'')+'</span>',
      '<span class="sig-tag '+tc(d.mom.cls)+'">动量 '+(d.mom.text||'')+'</span>',
      '<span class="sig-tag '+tc(d.bb.cls )+'">BB ' +(d.bb.text ||'')+'</span>',
      '<span class="sig-tag '+tc(d.ema&&d.ema.cls)+'">EMA '+(d.ema&&d.ema.text||'--')+'</span>',
      '<span class="sig-tag '+tc(d.sqz&&d.sqz.cls)+'">挤压 '+(d.sqz&&d.sqz.text||'--')+'</span>',
      '<span class="sig-tag '+tc(d.fr &&d.fr.cls) +'">费率 '+(d.fr &&d.fr.text ||'--')+'</span>',
    ].join('');
    const safeR=JSON.stringify(r).replace(/"/g,'&quot;');
    return '<div class="signal-card '+(isLong?'long':'short')+'">' +
      '<div class="sig-sym">'+r.symbol.replace('USDT','')+'<span style="color:var(--muted);font-size:9px">/U</span></div>' +
      '<div class="sig-dir '+(isLong?'long':'short')+'">'+(isLong?'▲ 做多':'▼ 做空')+'</div>' +
      '<div class="sig-stars">'+'★'.repeat(r.score)+'<span style="color:#dde1ea">'+'★'.repeat(Math.max(0,7-r.score))+'</span></div>' +
      '<div class="sig-tags">'+tags+'</div>' +
      '<div class="sig-price">'+r.price.toFixed(4)+'</div>' +
      '<div class="sig-trade"><button class="btn btn-primary btn-sm" onclick="tradeSignal('+safeR+')">交易</button></div>' +
      '</div>';
  }).join('');
}
function renderPrevSignals(prev, prevTs, curTs) {
  const sec = document.getElementById('prev-section');
  if (!prev.length) { sec.style.display='none'; return; }
  sec.style.display='block';
  document.getElementById('prev-ts-label').textContent = prevTs + (curTs ? ' → ' + curTs : '');
  document.getElementById('prev-tbody').innerHTML = prev.map(r=>{
    const isLong = r.direction==='LONG';
    const dirHtml = isLong
      ? '<span style="color:var(--green);font-weight:700">▲ 多</span>'
      : '<span style="color:var(--red);font-weight:700">▼ 空</span>';
    let priceChgHtml = '--', pnlHtml = '--';
    if (r.price_chg !== null && r.price_chg !== undefined) {
      const sign = r.price_chg >= 0 ? '+' : '';
      const cls  = r.price_chg > 0 ? 'pnl-up' : r.price_chg < 0 ? 'pnl-dn' : 'pnl-flat';
      priceChgHtml = '<span class="'+cls+'">'+sign+r.price_chg.toFixed(2)+'%</span>';
    }
    if (r.pnl_pct !== null && r.pnl_pct !== undefined) {
      const sign = r.pnl_pct >= 0 ? '+' : '';
      const cls  = r.pnl_pct > 0 ? 'pnl-up' : r.pnl_pct < 0 ? 'pnl-dn' : 'pnl-flat';
      pnlHtml = '<span class="'+cls+'">'+sign+r.pnl_pct.toFixed(2)+'%</span>';
    }
    const curPriceHtml = r.cur_price ? r.cur_price.toFixed(4) : '--';
    return '<tr>' +
      '<td><b>'+r.symbol.replace('USDT','')+'</b></td>' +
      '<td>'+dirHtml+'</td>' +
      '<td>'+r.price.toFixed(4)+'</td>' +
      '<td>'+curPriceHtml+'</td>' +
      '<td>'+priceChgHtml+'</td>' +
      '<td>'+pnlHtml+'</td>' +
      '<td><span style="color:var(--yellow)">'+'★'.repeat(r.score)+'</span></td>' +
      '</tr>';
  }).join('');
}
async function tradeSignal(signal) {
  const s=getScanSettings();
  const side=signal.direction==='LONG'?'BUY':'SELL';
  const cn=side==='BUY'?'做多':'做空';
  if (!confirm('确认交易？\n交易对: '+signal.symbol+'\n方向: '+cn+'\n评分: '+signal.score+'分\n金额: '+s.trade_usdt+' U  杠杆: '+s.leverage+'x\n止损: '+s.sl_pct+'%  止盈: '+s.tp_pct+'%')) return;
  const pr=await fetch('/api/price/'+signal.symbol).then(r=>r.json()).catch(()=>({}));
  const qty=Math.round((s.trade_usdt*s.leverage)/(pr.price||signal.price)*1000)/1000;
  const r=await fetch('/api/order/sltp', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({symbol:signal.symbol,side,qty,leverage:s.leverage,sl_pct:s.sl_pct,tp_pct:s.tp_pct})
  }).then(r=>r.json());
  if (r.ok) { toast('下单成功 '+cn+' '+signal.symbol, 'ok'); autoRefresh(); }
  else toast('下单失败: '+r.msg, 'err');
}
function initChart() {
  radarChart = echarts.init(document.getElementById('radar-chart'), null, {renderer:'canvas'});
  window.addEventListener('resize', ()=>radarChart.resize());
  radarChart.on('click', params=>{
    if (params.data?.value) { document.getElementById('f-sym').value=params.data.value[3]; toast('已选择: '+params.data.value[3], 'ok'); }
  });
}
async function loadTickers() {
  const r = await fetch('/api/tickers').then(r=>r.json()).catch(()=>({tickers:[]}));
  if (r.tickers?.length) { tickerData=r.tickers; renderChart(); document.getElementById('radar-ts').textContent=new Date().toLocaleTimeString(); }
}
function renderChart() {
  if (!radarChart||!tickerData.length) return;
  const maxVol = Math.max(...tickerData.map(t=>t.vol));
  const data = tickerData.map(t=>{
    const score=signalMap[t.symbol]||0;
    const size=Math.max(6,Math.min(38,t.vol/maxVol*38));
    let color;
    if      (score>=4) color='#dc2626';
    else if (score>=3) color='#d97706';
    else if (score>=2) color='#2563eb';
    else color=t.chg>0
      ?'rgba(22,163,74,'+(0.4+Math.min(Math.abs(t.chg)/18,.55))+')'
      :'rgba(220,38,38,'+(0.3+Math.min(Math.abs(t.chg)/18,.55))+')';
    return {
      value:[t.chg,t.vol,size,t.symbol,score],
      itemStyle:{color, borderColor:score>=2?'rgba(255,255,255,.7)':'transparent', borderWidth:score>=2?1:0,
        shadowBlur:score>=2?10:0, shadowColor:score>=3?'rgba(220,38,38,.4)':'rgba(37,99,235,.3)'},
      symbol:score>=2?'diamond':'circle',
      symbolSize:score>=2?size*1.3:size,
    };
  });
  const labels=tickerData.slice(0,28).map(t=>({
    coord:[t.chg,t.vol],
    value:(signalMap[t.symbol]>=2?'◆ ':'')+t.symbol.replace('USDT',''),
    label:{show:true,position:'right',fontSize:9,
      color:signalMap[t.symbol]>=2?'#2563eb':'#a0a8b8',
      fontWeight:signalMap[t.symbol]>=2?'bold':'normal'}
  }));
  radarChart.setOption({
    backgroundColor:'#ffffff',
    animation:true, animationDuration:500,
    grid:{left:50,right:18,top:22,bottom:34},
    xAxis:{type:'value',name:'24H涨跌%',
      nameTextStyle:{color:'#a0a8b8',fontSize:9},
      axisLine:{lineStyle:{color:'#e8ebf0'}},
      splitLine:{lineStyle:{color:'#f0f2f5',type:'dashed'}},
      axisLabel:{color:'#a0a8b8',fontSize:9}},
    yAxis:{type:'value',name:'成交额(亿)',
      nameTextStyle:{color:'#a0a8b8',fontSize:9},
      axisLine:{lineStyle:{color:'#e8ebf0'}},
      splitLine:{lineStyle:{color:'#f0f2f5',type:'dashed'}},
      axisLabel:{color:'#a0a8b8',fontSize:9}},
    tooltip:{trigger:'item',backgroundColor:'#fff',borderColor:'#dde1ea',
      textStyle:{color:'#1a1d2b',fontSize:11},
      formatter:p=>{
        const [chg,vol,,sym,score]=p.data.value;
        const sc=score>0?'<br><b style="color:#2563eb">信号: '+'★'.repeat(score)+'</b>':'';
        return '<b>'+sym+'</b><br>涨跌: '+(chg>0?'+':'')+chg.toFixed(2)+'%<br>成交额: '+vol.toFixed(1)+'亿'+sc;
      }},
    series:[{type:'scatter',data,markPoint:{data:labels,symbol:'none',animation:false}}],
  },true);
}
async function loadLog() {
  const r=await fetch('/api/log').then(r=>r.json()).catch(()=>({log:[]}));
  const box=document.getElementById('log-box');
  if (!r.log?.length) return;
  box.innerHTML=r.log.map(l=>'<div class="log-entry"><span class="ts">['+l.ts+']</span><span class="'+l.level+'">'+l.msg+'</span></div>').join('');
  box.scrollTop=box.scrollHeight;
}
async function clearLog() {
  await fetch('/api/log/clear', {method:'POST'}).catch(()=>{});
  document.getElementById('log-box').innerHTML='';
}
let toastTimer;
function toast(msg,type) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.display='block';
  el.style.color=type==='ok'?'var(--green)':type==='err'?'var(--red)':'var(--text)';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display='none',3500);
}
function initResizers() {
  colResize('resizer-left', '.panel-left',  false);
  colResize('resizer-right','.panel-right', true);
  colResize('resizer-inner','.radar-card',  false);
  rowResize('resizer-mid',  '.positions-card', true);
}
function colResize(id,sel,shrink) {
  const resizer=document.getElementById(id), el=document.querySelector(sel);
  if (!resizer||!el) return;
  resizer.addEventListener('mousedown',e=>{
    e.preventDefault();
    const startX=e.clientX, startW=el.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cssText='cursor:col-resize;user-select:none';
    const move=e=>{const w=Math.max(180,startW+(shrink?-(e.clientX-startX):(e.clientX-startX)));el.style.width=w+'px';el.style.minWidth='0';if(radarChart)radarChart.resize();};
    const up=()=>{resizer.classList.remove('dragging');document.body.style.cssText='';document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);if(radarChart)radarChart.resize();};
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}
// invert=true: 向上拖增大高度（用于底部面板）
function rowResize(id,sel,invert) {
  const resizer=document.getElementById(id), el=document.querySelector(sel);
  if (!resizer||!el) return;
  resizer.addEventListener('mousedown',e=>{
    e.preventDefault();
    const startY=e.clientY, startH=el.offsetHeight;
    resizer.classList.add('dragging');
    document.body.style.cssText='cursor:row-resize;user-select:none';
    const move=e=>{
      const delta = e.clientY - startY;
      const h = Math.max(80, startH + (invert ? -delta : delta));
      el.style.height=h+'px';
      if(radarChart)radarChart.resize();
    };
    const up=()=>{resizer.classList.remove('dragging');document.body.style.cssText='';document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);if(radarChart)radarChart.resize();};
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}
